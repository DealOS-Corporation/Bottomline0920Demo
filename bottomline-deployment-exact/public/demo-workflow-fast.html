<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>DealOS — Bottomline Pricing Workflow Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#060810;font-family:Inter,system-ui,-apple-system,sans-serif;}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
#ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 16px 8px;width:100%;flex-shrink:0;z-index:100;}
.btn{background:#1595c2;color:#fff;border:none;border-radius:8px;padding:8px 20px;font-size:13px;cursor:pointer;font-weight:600;transition:background .15s;}
.btn:hover{background:#0f7fa8;}
.btn.ghost{background:#1a1a2e;} .btn.ghost:hover{background:#27273d;}
.badge{background:rgba(21,149,194,.15);color:#7fd4ee;border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;}
.steps{display:flex;gap:6px;align-items:center;}
.step-dot{width:9px;height:9px;border-radius:50%;background:#2a2f3a;transition:background .2s;}
.step-dot.active{background:#1595c2;box-shadow:0 0 8px rgba(21,149,194,.7);}
.step-dot.done{background:#4ade80;}
#wrap{flex:1;width:100%;position:relative;overflow:hidden;}
.canvas{position:absolute;top:0;left:50%;transform-origin:top center;width:1920px;height:1080px;margin-left:-960px;overflow:hidden;background:#0B0F1A;}
.demo-layer{position:absolute;inset:0;z-index:10;}
#demo-iframe{position:absolute;top:0;left:0;width:1920px;height:1080px;border:none;background:#fff;}
.hl-box{position:absolute;pointer-events:none;z-index:30;border:3px solid rgba(21,149,194,.95);border-radius:10px;box-shadow:inset 0 0 0 1px rgba(200,240,255,.6),0 0 0 4px rgba(21,149,194,.18),0 12px 30px rgba(0,0,0,.28);opacity:0;transition:opacity .3s,left .3s,top .3s,width .3s,height .3s;}
.hl-box.show{opacity:1;}
.cursor{position:absolute;width:22px;height:26px;pointer-events:none;z-index:50;opacity:0;transition:opacity .2s,left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1);}
.cursor.show{opacity:1;}
.cursor svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.cursor-click{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.6);pointer-events:none;z-index:51;opacity:0;}
.subtitle{position:absolute;bottom:38px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(7,11,24,.55);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.10);border-top:2px solid rgba(21,149,194,.65);border-radius:6px;padding:20px 50px;color:#EEF2FF;font-size:27px;font-weight:500;text-align:center;max-width:1600px;line-height:1.3;text-shadow:0 1px 6px rgba(0,0,0,.9);opacity:0;transition:opacity .28s ease,transform .36s cubic-bezier(.22,1,.36,1);pointer-events:none;z-index:80;}
.subtitle.show{opacity:1;transform:translateX(-50%) translateY(0);}
#outro{position:absolute;inset:0;z-index:90;background:#f7fafc;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s ease;}
#outro.show{opacity:1;}
#outro .logo{width:640px;max-width:60%;height:auto;filter:blur(18px);opacity:0;transform:scale(.92);transition:filter 1.1s cubic-bezier(.22,1,.36,1),opacity 1.1s ease,transform 1.1s cubic-bezier(.22,1,.36,1);}
#outro.show .logo{filter:blur(0px);opacity:1;transform:scale(1);}
#dbg{position:fixed;bottom:6px;right:8px;background:rgba(0,0,0,.7);color:#7fd4ee;font-size:11px;font-family:monospace;padding:6px 10px;border-radius:6px;max-width:420px;z-index:9999;pointer-events:none;white-space:pre-wrap;}
</style>
</head>
<body>

<div id="ctrl">
  <button class="btn" id="btn-play">&#9654; Play</button>
  <button class="btn ghost" id="btn-reset">&#8635; Reset</button>
  <span class="badge" id="badge">Ready</span>
  <div class="steps">
    <div class="step-dot" data-step="0"></div>
    <div class="step-dot" data-step="1"></div>
    <div class="step-dot" data-step="2"></div>
    <div class="step-dot" data-step="3"></div>
    <div class="step-dot" data-step="4"></div>
  </div>
</div>

<div id="wrap">
  <div class="canvas" id="canvas">
    <div class="demo-layer">
      <iframe id="demo-iframe" src="/deals"></iframe>
    </div>
    <div class="hl-box" id="hl-box"></div>
    <div class="cursor" id="cursor">
      <svg viewBox="0 0 24 28" fill="white" stroke="black" stroke-width="1">
        <path d="M2 2 L2 22 L7 18 L10 26 L13 24.5 L10 17 L17 17 Z"/>
      </svg>
    </div>
    <div class="cursor-click" id="cursor-click"></div>
    <div class="subtitle" id="subtitle"></div>
    <div id="outro"><img class="logo" src="/dealos-logo.png" alt="DealOS"></div>
  </div>
</div>
<div id="dbg"></div>
<audio id="narration" src="/narration.mp3" preload="auto"></audio>
<audio id="bgm" src="/bgm.mp3" preload="auto" loop></audio>

<script>
const g = (id) => document.getElementById(id);
const wrap = g('wrap'), canvas = g('canvas');

function rescale() {
  const scale = Math.min(wrap.clientWidth / 1920, wrap.clientHeight / 1080);
  canvas.style.transform = 'scale(' + scale + ')';
  canvas.style.top = Math.max(0, (wrap.clientHeight - 1080 * scale) / 2) + 'px';
}
rescale();
window.addEventListener('resize', rescale);

function dbg(text) { g('dbg').textContent = text; }
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

// ── iframe access (same-origin: served from this same Next.js app) ──
function idoc() { try { return g('demo-iframe').contentDocument; } catch (e) { return null; } }

function findButton(matchText) {
  const doc = idoc();
  if (!doc) return null;
  const buttons = Array.from(doc.querySelectorAll('button'));
  return buttons.find((b) => b.textContent && b.textContent.includes(matchText) && !b.disabled) || null;
}

function findButtonExact(text) {
  const doc = idoc();
  if (!doc) return null;
  const buttons = Array.from(doc.querySelectorAll('button'));
  return buttons.find((b) => b.textContent && b.textContent.trim() === text && !b.disabled) || null;
}

function waitForButton(matchText, timeoutMs) {
  timeoutMs = timeoutMs || 20000;
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function poll() {
      const btn = findButton(matchText);
      if (btn) { resolve(btn); return; }
      if (Date.now() - t0 > timeoutMs) { reject(new Error('timeout: ' + matchText)); return; }
      setTimeout(poll, 80);
    })();
  });
}

function waitUntil(conditionFn, timeoutMs, pollMs) {
  timeoutMs = timeoutMs || 15000; pollMs = pollMs || 100;
  return new Promise((resolve) => {
    const t0 = Date.now();
    (function poll() {
      if (conditionFn()) { resolve(true); return; }
      if (Date.now() - t0 > timeoutMs) { resolve(false); return; }
      setTimeout(poll, pollMs);
    })();
  });
}

let curX = 960, curY = 540;
function showCursor() { g('cursor').classList.add('show'); }
function hideCursor() { g('cursor').classList.remove('show'); }
function moveCursor(x, y) { curX = x; curY = y; g('cursor').style.left = x + 'px'; g('cursor').style.top = y + 'px'; }
function clickEffect() {
  const el = g('cursor-click');
  el.style.transition = 'none';
  el.style.left = (curX - 7) + 'px'; el.style.top = (curY - 7) + 'px';
  el.style.opacity = '.6'; el.style.transform = 'scale(.5)';
  requestAnimationFrame(() => {
    el.style.transition = 'opacity .35s, transform .35s';
    el.style.opacity = '0'; el.style.transform = 'scale(2)';
  });
}

function highlightRect(rect, padding) {
  padding = padding || 8;
  const box = g('hl-box');
  box.style.left = (rect.left - padding) + 'px';
  box.style.top = (rect.top - padding) + 'px';
  box.style.width = (rect.width + padding * 2) + 'px';
  box.style.height = (rect.height + padding * 2) + 'px';
  box.classList.add('show');
}
function hlOff() { g('hl-box').classList.remove('show'); }

// Bounding box that encloses several elements at once (for group highlights).
function unionRect(els) {
  const rects = els.filter(Boolean).map((e) => e.getBoundingClientRect());
  if (!rects.length) return null;
  const left = Math.min(...rects.map((r) => r.left));
  const top = Math.min(...rects.map((r) => r.top));
  const right = Math.max(...rects.map((r) => r.right));
  const bottom = Math.max(...rects.map((r) => r.bottom));
  return { left, top, width: right - left, height: bottom - top };
}

async function highlightRectFor(rect, ms) {
  if (!rect) { await sleep(ms); return; }
  showCursor();
  moveCursor(rect.left + rect.width / 2, rect.top + rect.height / 2);
  highlightRect(rect, 10);
  await sleep(ms);
  hlOff();
}

function findLinkByHref(href) {
  const doc = idoc();
  return doc ? doc.querySelector('a[href="' + href + '"]') : null;
}

async function clickLinkWhenReady(href, timeoutMs) {
  const ok = await waitUntil(() => !!findLinkByHref(href), timeoutMs || 8000);
  if (!ok) { dbg('link not found: ' + href); return null; }
  const el = await pointAtAndClickMatcher(() => findLinkByHref(href));
  dbg('clicked link: ' + href);
  return el;
}

// Runs `fn` to full completion — never abandons it mid-click, and never
// pauses the narration audio. Real backend actions are kept fast enough
// (minimal hover/settle delays, short poll intervals) to finish inside
// `budgetMs`; if fn finishes early we just wait out the remainder so the
// next caption still lands on time.
async function runTimedSegment(fn, budgetMs) {
  const t0 = Date.now();
  if (fn) {
    try { await fn(); } catch (e) { dbg('seg err: ' + e.message); }
  }
  const elapsed = Date.now() - t0;
  if (elapsed < budgetMs) {
    await sleep(budgetMs - elapsed);
  }
}

// Points at + clicks whatever `matcherFn()` currently returns. Re-queries
// right before the actual click, since the real app re-renders during the
// hover pause and can silently detach the element we first found.
async function pointAtAndClickMatcher(matcherFn) {
  const btn0 = matcherFn();
  if (!btn0) return null;
  const rect = btn0.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  showCursor();
  moveCursor(cx, cy);
  highlightRect(rect);
  await sleep(70);
  const btn = matcherFn();
  if (!btn) { hlOff(); return null; }
  clickEffect();
  btn.click();
  await sleep(60);
  hlOff();
  return btn;
}

async function clickWhenReady(matchText, timeoutMs) {
  dbg('waiting for: ' + matchText);
  await waitForButton(matchText, timeoutMs);
  const btn = await pointAtAndClickMatcher(() => findButton(matchText));
  dbg('clicked: ' + matchText);
  return btn;
}

function sub(text) { const el = g('subtitle'); el.textContent = text; el.classList.add('show'); }
function subOff() { g('subtitle').classList.remove('show'); }

function setStep(n) {
  document.querySelectorAll('.step-dot').forEach((dot) => {
    const i = Number(dot.dataset.step);
    dot.classList.toggle('active', i === n);
    dot.classList.toggle('done', i < n);
  });
}
function badge(text) { g('badge').textContent = text; }

// ============================================================
// WORKFLOW SCRIPT — manually runs each real pipeline step, one
// click at a time, in "Review each step" mode (no Autopilot).
// Every click is highlighted while its matching caption is shown,
// so highlight and narration always point at the same action.
// ============================================================
let playing = false;
let runToken = 0;

// Runs ONE real technical step (click its tab, click Run step,
// wait for it to finish, resolve any human-review gate it needs).
async function runOneStep(tabMatch, myToken) {
  if (myToken !== runToken) return;
  await clickWhenReady(tabMatch, 8000);
  if (myToken !== runToken) return;
  const unlocked = await waitUntil(() => !!findButtonExact('Run step'), 15000);
  if (myToken !== runToken) return;
  if (!unlocked) { dbg('not unlocked yet: ' + tabMatch); return; }
  await pointAtAndClickMatcher(() => findButtonExact('Run step'));
  if (myToken !== runToken) return;
  await waitUntil(() => !findButtonExact('Running…'), 20000);
  if (myToken !== runToken) return;
  // The gate button (if this step needs one) can take a beat to render after
  // "Running…" clears — poll for it instead of a single fixed-delay check,
  // otherwise we silently move on without approving and later steps stay locked.
  const gateTexts = ['Approve & continue', 'Accept all'];
  await waitUntil(() => gateTexts.some((t) => !!findButtonExact(t)), 4000, 80);
  if (myToken !== runToken) return;
  for (const gateText of gateTexts) {
    if (myToken !== runToken) return;
    if (findButtonExact(gateText)) { await pointAtAndClickMatcher(() => findButtonExact(gateText)); await sleep(60); break; }
  }
}

// Send Back has no "Run step" phase — the draft auto-populates once the
// tab is opened. We only open the tab and highlight the drafted email;
// we never click "Punch out to email" (that's a real send action).
async function openGateOnlyStep(tabMatch, gateText, myToken) {
  if (myToken !== runToken) return;
  await clickWhenReady(tabMatch, 8000);
  if (myToken !== runToken) return;
  const ready = await waitUntil(() => !!findButtonExact(gateText), 15000);
  if (myToken !== runToken) return;
  if (!ready) { dbg('not unlocked yet: ' + tabMatch); return; }
  const btn = findButtonExact(gateText);
  if (btn) { await highlightRectFor(btn.getBoundingClientRect(), 500); }
}

// ── Per-segment actions, one per narration beat ──

async function actHomepageTour(myToken, budget) {
  const doc = idoc();
  if (!doc) { await sleep(budget); return; }
  const rows = Array.from(doc.querySelectorAll('a[href^="/deals/"]'));
  await highlightRectFor(unionRect(rows), budget);
}

async function actHomepageChannels(myToken, budget) {
  const doc = idoc();
  if (!doc) { await sleep(budget); return; }
  const channelBtn = Array.from(doc.querySelectorAll('button')).find((b) => b.textContent.includes('Salesforce'));
  const channelRow = channelBtn ? channelBtn.parentElement : null;
  await highlightRectFor(channelRow ? channelRow.getBoundingClientRect() : null, budget);
}

async function actEnterDeal(myToken) {
  await clickLinkWhenReady('/deals/deal-001', 3000);
}

async function actStep1(myToken) {
  try { await clickWhenReady('Review each step', 3000); } catch (e) { dbg('mode: ' + e.message); }
  if (myToken !== runToken) return;
  await runOneStep('Intake', myToken);
}

async function actStep2(myToken, budget) {
  const tabs = ['Clean', 'ROC Match', 'Pricing', 'Classify'];
  const per = Math.floor(budget / tabs.length);
  for (const tab of tabs) {
    if (myToken !== runToken) return;
    await runTimedSegment(() => runOneStep(tab, myToken), per);
  }
}

async function actStep3(myToken, budget) {
  // ROI Deck (PPT + workbook rendering) genuinely takes longer than Value
  // Stmt on the real backend, so give it a bigger share of the budget.
  const weights = [{ tab: 'Value Stmt', w: 0.35 }, { tab: 'ROI Deck', w: 0.65 }];
  for (const { tab, w } of weights) {
    if (myToken !== runToken) return;
    await runTimedSegment(() => runOneStep(tab, myToken), Math.floor(budget * w));
  }
}

async function actStep4(myToken) {
  await openGateOnlyStep('Send Back', 'Punch out to email', myToken);
}

async function actSalesforceBadge(myToken, budget) {
  const doc = idoc();
  if (!doc) { await sleep(budget); return; }
  const el = Array.from(doc.querySelectorAll('[title]')).find((n) => n.textContent.includes('Salesforce'));
  await highlightRectFor(el ? el.getBoundingClientRect() : null, Math.max(500, budget - 200));
}

async function actDashboard(myToken, budget) {
  await clickLinkWhenReady('/dashboard', 3000);
  if (myToken !== runToken) return;
  await waitUntil(() => { const d = idoc(); return !!(d && d.body.innerText.includes('Pricing Operations')); }, 4000);
  const doc = idoc();
  if (!doc) return;
  const marker = Array.from(doc.querySelectorAll('*')).find((el) => el.children.length === 0 && el.textContent.trim() === 'Turnaround by deal');
  const card = marker ? marker.closest('section, div') : null;
  await highlightRectFor(card ? card.getBoundingClientRect() : null, Math.max(600, budget - 3000));
}

// ── Timeline: caption + action start times (ms), measured from narration.mp3
// via silence-gap detection so segment boundaries land exactly on the pauses.
// Captions are split into short professional-caption-style chunks (not one
// paragraph block) that advance across the segment's budget in sync with the
// audio, instead of sitting on screen unchanged for the whole segment. ──
const TIMELINE = [
  { t: 0, badge: 'Overview', step: 0, action: null,
    captions: ["Payer pricing engine is an AI-driven pricing tool designed for Bottomline's pricing team to automate manual pricing procedures and unlock sales pipeline currently constrained by pricing capacity."] },
  { t: 11780, badge: 'Overview', step: 0, action: actHomepageTour,
    captions: ["The homepage serves as the central pricing operations dashboard, giving the team one view of all active requests, their status, ownership, and progress across the workflow."] },
  { t: 21860, badge: 'Overview', step: 0, action: actHomepageChannels,
    captions: ["Requests can originate from Salesforce or email, with the relevant deal information and attachments automatically captured here."] },
  { t: 29800, badge: 'Opening Workspace', step: 0, action: actEnterDeal,
    captions: ["Each request moves through four key steps."] },
  { t: 33720, badge: 'Step 1 — Intake & Data Preparation', step: 1, action: actStep1,
    captions: ["Step one is intake and data preparation.", "AI validates incoming files, identifies missing information, and prepares clarification requests for analyst review."] },
  { t: 44600, badge: 'Step 2 — Pricing Execution', step: 2, action: actStep2,
    captions: ["Step two is pricing execution.", "AI orchestrates the existing Alteryx and ROC workflows, applies industry segmentation and campaign-classification rules, and provides real-time completion alerts to reduce idle time between steps."] },
  { t: 58860, badge: 'Step 3 — Output Generation', step: 3, action: actStep3,
    captions: ["Step three is output generation.", "Once pricing is finalized, DealOS generates the internal value statement and customer ROI deck using approved templates and validated deal data, reducing manual Excel, PowerPoint, and formatting work."] },
  { t: 73840, badge: 'Step 4 — Final Delivery', step: 4, action: actStep4,
    captions: ["Step four is final delivery.", "DealOS prepares the outbound email with the appropriate recipients and completed deliverables for final analyst review and approval."] },
  { t: 83520, badge: 'Salesforce Sync', step: 4, action: actSalesforceBadge,
    captions: ["Throughout the process, DealOS automatically updates Salesforce so the system of record remains current without additional manual entry."] },
  { t: 92080, badge: 'Management Tracker', step: 4, action: actDashboard,
    captions: ["And from the management tracker, pricing leaders can monitor deal volume, status, turnaround time, and overall workflow performance in one view."] },
  { t: 102180, badge: 'Result', step: 4, action: null,
    captions: ["To summarize: one AI-driven pricing workflow that expands the capacity of the existing operations team and enables Bottomline to support more deal opportunities without proportional headcount growth."] },
  { t: 114020, badge: 'Result', step: 4, action: actOutro,
    captions: [] },
];

// Advances through `chunks` (whole sentences, never split mid-sentence) one at
// a time across `budgetMs`, each held for a share of time proportional to its
// word count, with a brief clear between sentences — mimics real broadcast
// captions instead of one text block sitting on screen the whole segment.
async function cycleCaptions(chunks, budgetMs, myToken) {
  if (!chunks || !chunks.length) { subOff(); return; }
  const words = chunks.map((c) => c.trim().split(/\s+/).length);
  const totalWords = words.reduce((a, b) => a + b, 0) || 1;
  const minMs = 1400;
  let remaining = budgetMs;
  for (let i = 0; i < chunks.length; i++) {
    if (myToken !== runToken) return;
    const isLast = i === chunks.length - 1;
    const dur = Math.min(remaining, isLast ? remaining : Math.max(minMs, Math.round(budgetMs * words[i] / totalWords)));
    sub(chunks[i]);
    await sleep(Math.max(300, isLast ? dur : dur - 90));
    if (myToken !== runToken) return;
    if (!isLast) { subOff(); await sleep(90); }
    remaining -= dur;
  }
}

// Pure-white DealOS splash: hides the app/cursor/caption and blur-fades the
// logo in, holds, then fades it back out — replaces the plain "Thanks for
// watching" caption with a clean outro instead of narrating over the app UI.
async function actOutro(myToken, budget) {
  hideCursor(); hlOff(); subOff();
  const outro = g('outro');
  outro.classList.add('show');
  const holdMs = Math.max(400, budget - 900);
  await sleep(holdMs);
  if (myToken !== runToken) { outro.classList.remove('show'); return; }
  outro.classList.remove('show');
  const bgm = g('bgm');
  const fadeStart = bgm.volume;
  const fadeMs = Math.min(700, Math.max(0, budget - holdMs));
  const fadeT0 = Date.now();
  while (Date.now() - fadeT0 < fadeMs) {
    bgm.volume = Math.max(0, fadeStart * (1 - (Date.now() - fadeT0) / fadeMs));
    await sleep(50);
  }
  bgm.pause();
  await sleep(Math.max(0, budget - holdMs - fadeMs));
}

async function runWorkflow(myToken) {
  badge('Playing');
  setStep(0);
  for (let i = 0; i < TIMELINE.length; i++) {
    if (myToken !== runToken) return;
    const seg = TIMELINE[i];
    const nextT = i + 1 < TIMELINE.length ? TIMELINE[i + 1].t : seg.t + 2600;
    const budget = Math.max(300, nextT - seg.t);
    badge(seg.badge);
    setStep(seg.step);
    await Promise.all([
      runTimedSegment(seg.action ? () => seg.action(myToken, budget) : null, budget),
      cycleCaptions(seg.captions, budget, myToken),
    ]);
    if (myToken !== runToken) return;
  }
  subOff();
  hideCursor();
  g('outro').classList.remove('show');
  badge('Done');
  g('btn-play').textContent = '\u25B6 Replay';
  playing = false;
}

function play() {
  if (playing) return;
  playing = true;
  runToken++;
  const myToken = runToken;
  g('btn-play').textContent = '\u23F8 Playing...';
  const audio = g('narration');
  audio.currentTime = 0;
  audio.play().catch((e) => dbg('audio: ' + e.message));
  const bgm = g('bgm');
  bgm.currentTime = 0;
  bgm.volume = 0.13;
  bgm.play().catch((e) => dbg('bgm: ' + e.message));
  runWorkflow(myToken);
}

function doReset() {
  runToken++;
  playing = false;
  const audio = g('narration');
  audio.pause();
  audio.currentTime = 0;
  const bgm = g('bgm');
  bgm.pause();
  bgm.currentTime = 0;
  hideCursor(); hlOff(); subOff();
  g('outro').classList.remove('show');
  setStep(0);
  badge('Ready');
  g('btn-play').textContent = '\u25B6 Play';
  const iframe = g('demo-iframe');
  iframe.src = 'about:blank';
  setTimeout(() => { iframe.src = '/deals'; }, 150);
}

g('btn-play').addEventListener('click', play);
g('btn-reset').addEventListener('click', doReset);
</script>
</body>
</html>
