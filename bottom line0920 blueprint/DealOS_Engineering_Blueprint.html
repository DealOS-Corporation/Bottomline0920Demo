      { text: 'Interpret request with AI-T1 → RequestIntent; validate evidence quotes', zh: '去掉签名和引用历史后交给 T1：这是定价请求、追问回复还是别的？银行、场景、缺什么？AI 引用的每句证据必须是原文子串，否则作废', part: 'interpreter', edges: ['IF-112', 'IF-111'], fail: 'T1 两次格式不合法 → issue NEEDS_TRIAGE，不猜；intent=other → 同样交人' },
      { text: 'Parse workbook: pick payment sheet, detect header row (first 8 rows)', zh: '逐个工作表扫前 8 行，选与已知字段名 / 银行别名匹配最多的那一行做表头；多表时按“匹配到的必填字段 ×10 + 行数/1000”打分选表，分不出高低 → 送人（R-IN-04）', part: 'parser', edges: ['IF-110'], fail: '加密 / 损坏 → UNSUPPORTED_FILE，不反复重试；数字解析失败记为单元格错误，绝不当 0' },
      { text: 'Map columns: mapping-profile aliases first, remaining → AI-T2 (≥0.90 auto)', zh: '先用该银行映射配置里的精确名 / 别名对（把握 1.0）；剩下的列给 T2（表头 + 最多 5 个脱敏样本）；把握 ≥ 0.90 且目标字段没被占用才自动采用；银行账号 / 税号按正则识别为敏感列，永不给 AI 看样本', part: 'mapper', edges: ['IF-116', 'IF-113'], fail: '两列对到同一个标准字段 → 送 FE-05 复核；T2 失败 → 所有未对上的列送复核' },
      { text: 'Validate R-IN-01..04 via CORE-09 → IntakeReport; record assumptions', zh: '必填列缺了 = 阻塞（R-IN-01）；没有付款日期 → 记“分析周期 12 个月”假设，待批（R-IN-02）；没有支付类型 → 默认 Check 假设（R-IN-03）；金额非数字、币种混杂、负数退款都要标出来', part: 'validator', edges: ['IF-115', 'IF-111'], fail: '有阻塞问题 → 跳到第 10 步起草追问；假设永远标 source=default，不冒充源数据' },
      { text: 'Write File 2 (mapping sheet) + normalized dataset + dataset_rows', zh: '把映射表写成 File 2 Excel，标准化行写成 parquet 存 S3 normalized 区，同时装进 dataset_rows 表（金额用 NUMERIC）；每个工件的 sha256 从字节算', part: 'writer', edges: ['IF-110', 'IF-111'], fail: 'S3 写成功但数据库提交失败 → 任务重跑时按 sha256 发现候选对象已存在，直接登记，不重传' },
      { text: 'No blocking → stage intake PASS → clean.submit; blocking → AI-T3 clarification draft → external_action PREPARED → WAITING_INPUT', zh: '没有阻塞：阶段通过，下一步清洗任务自动排队。有阻塞：让 T3 按缺失清单起草追问邮件，收件人 = 原发件人 + Paymode 共享邮箱（规则定，不是 AI 定），存成待确认的外部动作，分析师在 FE-06 确认后由 WF-10 发出', part: 'clarifier', edges: ['IF-114', 'IF-111'], fail: 'T3 失败 → 用固定模板文字兜底，仍需人工确认后才发' },
      { text: 'Resume after reply: new attachment → new input revision → supersede old run → start new run', zh: '银行回复带了新文件 → 重新走第 6 步起，生成输入修订 n+1，旧 run 标 SUPERSEDED（不改它），新 run 从收件开始；只回了文字没附件 → 分析师在 FE-06 确认假设后继续', part: 'handler', edges: ['IF-117', 'IF-111'], fail: '回复没有可用内容 → issue 保持打开，SLA 计时继续' }
    ]
  },

  functions: [
    { fn: 'handle(task, lease) → TaskResult', io: 'task {kind ∈ intake.fetch_message | intake.process | intake.resume, run_id?, deal_id?, input_manifest} → TaskResult', logic: 'kind == fetch_message → _fetch(source_event)\nkind == process → _process(input_revision)\nkind == resume → _resume(message)\nlease.heartbeat() every 20 s; no DB tx open during Graph / S3 / AI calls', fail: 'lease lost → stop, discard candidates', zh: '入口：按任务类型分三条路；每 20 秒报心跳；调外部服务时不持有数据库事务' },
    { fn: 'handle_fetch_message(source_event) → SourceMessageRef', io: 'source_event {subscription_id, resource_id} → source_messages row + raw.eml + File 1 artifacts', logic: 'msg = CONN-01.fetch_message(mbx, immutable_id, $select=id,internetMessageId,conversationId,from,toRecipients,subject,receivedDateTime,hasAttachments,body)\nif exists(source_messages by (tenant, connection, mbx, immutable_id)) → return existing (idempotent)\nmime = GET /$value → S3 sources/raw.eml (sha256)\nfor a in attachments: fileAttachment and ext ∈ {xlsx,xls,csv} → S3 quarantine → scan → artifact kind=file01\ndeal = DealLinker.link(msg); enqueue intake.process (or intake.resume if open clarification on the conversation)', fail: 'Graph 404 → source_event DONE_NOOP; scan REJECTED → issue UNSUPPORTED_FILE → WAITING_INPUT', zh: '取邮件、存证据、存附件、挂 deal、排下一步任务；同一封邮件来一百次也只处理一次' },
    { fn: 'interpret_request(deal, message) → RequestIntent', io: 'subject + cleaned body + sender → {intent, bank, scenario_hint, requested_items[], missing[], evidence[]}', logic: 'strip signatures / quoted history → AI-T1 intake_interpretation\nvalidate: intent ∈ {pricing_request, clarification_reply, other}; bank ∈ bank_channel; every evidence quote is a substring of the text\nintent == clarification_reply → attach to the open issue (by conversationId)\nintent == other → issue NEEDS_TRIAGE', fail: 'T1 schema invalid ×2 → NEEDS_TRIAGE; never guess', zh: '让 AI 读邮件，但每个结论都要有原文证据；读不懂就交给人，不猜' },
    { fn: 'parse_payment_file(artifact_ref) → ParsedWorkbook', io: 'File 1 (xlsx/csv) → {sheets[{name, header_row, headers[], rows_n, samples}], chosen_sheet}', logic: 'openpyxl read_only; per sheet scan first 8 rows; header_row = row with max matches vs KNOWN_FIELD_NAMES ∪ profile aliases\nselect_payment_sheet: score = matched_required*10 + rows_n/1000; tie or score < 2 → ambiguity issue (R-IN-04)\nnumbers parsed with explicit locale; unparsable → cell error, never 0', fail: 'encrypted / corrupt → UNSUPPORTED_FILE (single attempt)', zh: '找对工作表和表头行；分不清就问人；数字读不出来就标错，不能悄悄变 0' },
    { fn: 'map_input_columns(headers, samples, mapping_version) → ColumnMapping', io: 'headers + ≤5 masked samples per column → {source→canonical, confidence, method ∈ alias | ai | analyst}', logic: 'exact / alias match from mapping profile first (confidence 1.0)\nremaining → AI-T2 column_mapping; accept if confidence ≥ 0.90 and canonical not already taken\nevery source column mapped or explicitly dropped (R-CLN-01); Bank Account / TIN by regex → canonical sensitive, never sampled to LLM\nany column < 0.90 → mapping needs review → FE-05', fail: 'duplicate canonical target → review; T2 failure → all unmatched to review', zh: '列名对标准字段：先查银行别名表，查不到再问 AI；把握不够的送人确认；敏感列绝不给 AI 看内容' },
    { fn: 'validate_intake(dataset, ruleset, assumptions) → IntakeReport', io: 'normalized rows + R-IN-* → {blocking_issues[], warnings[], assumptions[], column_mapping, row_count, currency_totals, source_refs}', logic: 'R-IN-01 required: Vendor Name, Payment Amt, Address Line 1, City, State (aliases per bank) → missing = BLOCKING\nR-IN-02 no Payment Date → assumption {analysis_period_months: 12, source: default, approval: pending}\nR-IN-03 no Payment Type → assumption {payment_type_default: Check}\nrow checks: amount numeric, single currency or grouped totals, negatives flagged\nno blocking → stage_result intake PASS → enqueue clean.submit', fail: 'blocking → run WAITING_INPUT + draft_missing_information', zh: '按四条收件规则检查；缺必填就阻塞；缺日期 / 支付类型就记成“假设”等人批，不冒充事实' },
    { fn: 'draft_missing_information(issue_set) → ExternalActionRef', io: 'blocking issues → clarification draft {subject, body, to, cc} as external_action PREPARED (type clarification_mail)', logic: 'AI-T3 clarification_draft with explicit missing list + bank tone template\nrecipients = original sender (to) + Paymode shared mailbox (cc) from bank_channel — never from model output\nsave external_action PREPARED → FE-06 confirm → approval scope CLARIFICATION_MAIL → dispatch → WF-10', fail: 'T3 fails → template fallback text; still requires human confirm', zh: '起草追问邮件；AI 只写正文，收件人由规则定；没人点确认就不会发' },
    { fn: 'resume_after_reply(deal, message) → RunRef', io: 'clarification reply (same conversationId) → input revision n+1 → new run', logic: 'attachment present → parse_payment_file → input_revision n+1 → CORE-01.supersede_run(old) → start_run(new)\nno attachment but answers in text → analyst confirms assumptions in FE-06 → resume same run', fail: 'reply without usable content → issue stays open; SLA timer continues', zh: '银行回信：有新文件就开新一轮（旧的标作废，不改），只有文字就让分析师确认后继续' }
  ],

  contract: [
    { name: 'task intake.fetch_message', dir: 'In', shape: '{task_id, tenant_id, task_kind:"intake.fetch_message", input_manifest:{source_event_id, connection_id, mailbox, immutable_message_id}, fence}', example: '{"task_kind":"intake.fetch_message","input_manifest":{"source_event_id":"se_01J9…","connection_id":"conn_graph_paymode","mailbox":"paymode-pricing@bottomline.com","immutable_message_id":"AAMkAGI2…"},"fence":1}', zh: 'Webhook 收到通知后派出的“去取邮件”任务：只带邮件 ID，不带正文' },
    { name: 'task intake.process', dir: 'In', shape: '{task_kind:"intake.process", run_id, deal_id, input_manifest:{input_revision_id, file01_artifact_ids[], mapping_profile_version, ruleset_version, prompt_versions{t1,t2,t3}}, fence}', example: '{"task_kind":"intake.process","run_id":"r_01J9…","input_manifest":{"input_revision_id":"ir_3","file01_artifact_ids":["a_9c1…"],"mapping_profile_version":"jpm-2026.09.1","ruleset_version":"in-2026.09.1"},"fence":2}', zh: '“开始处理这份输入”任务：File 1 已经在 S3 且扫描通过；映射配置和规则版本已锁定' },
    { name: 'source_messages row', dir: 'Out', shape: '{tenant_id, connection_id, mailbox_id, immutable_message_id (UNIQUE), internet_message_id, conversation_id, from_address, subject, received_at, raw_eml_artifact_id, deal_id, revision}', example: '{"immutable_message_id":"AAMkAGI2…","conversation_id":"AAQkAGI2…","from_address":"rm.smith@bank.example","subject":"Paymode pricing request – ACME Corp","deal_id":"d_01J9…"}', zh: '每封处理过的邮件一条记录；唯一键保证同一封邮件不会建两个 deal' },
    { name: 'AI-T1 request / response (intake_interpretation.v1)', dir: 'Out / In', shape: 'req {subject, body_text (signatures stripped), sender_domain, known_banks[], known_scenarios[]} → resp {intent ∈ pricing_request|clarification_reply|other, bank|null, scenario_hint|null, requested_items[], missing[], evidence:[{claim, quote}]}', example: '{"intent":"pricing_request","bank":"JPM","scenario_hint":"Comprehensive","missing":["analysis_period"],"evidence":[{"claim":"scenario","quote":"please run the comprehensive analysis"}]}', zh: '给 AI 的是邮件文字和已知银行 / 场景名单；AI 每个结论都要附原文引用，代码会核对引用是否真的在正文里' },
    { name: 'AI-T2 request / response (column_mapping.v1)', dir: 'Out / In', shape: 'req {columns:[{source_header, samples[≤5] (masked if sensitive-pattern)}], canonical_fields[], already_mapped[]} → resp {mappings:[{source_header, canonical|null, confidence 0..1, reason}]} — no invented columns', example: '{"mappings":[{"source_header":"Payee","canonical":"vendor_name","confidence":0.97,"reason":"payee is the vendor being paid"},{"source_header":"Acct #","canonical":null,"confidence":0,"reason":"sensitive"}]}', zh: '给 AI 表头 + 几个样本值让它猜是哪个标准字段；账号 / 税号列不给样本；AI 不能凭空造列' },
    { name: 'IntakeReport', dir: 'Out', shape: '{run_id, input_revision_id, row_count, currency_totals:{USD: Decimal…}, column_mapping, blocking_issues:[{code, field, message}], warnings[], assumptions:[{key, value, source:"default"|"source_data", approval:"pending"|"approved"}], source_refs}', example: '{"row_count":4812,"currency_totals":{"USD":"128443210.55"},"blocking_issues":[],"assumptions":[{"key":"analysis_period_months","value":12,"source":"default","approval":"pending"}]}', zh: '收件阶段的“体检报告”：多少行、多少钱、哪些列对上了、缺什么、默认了什么' },
    { name: 'File 2 + normalized dataset', dir: 'Out', shape: 'file02.xlsx sheet "Mapping" (source, canonical, method, confidence) + dataset.parquet (canonical columns, typed) · artifacts kind=file02 | dataset, audience=INTERNAL, parent=file01', example: 'normalized/tenants/{t}/deals/{d}/runs/{r}/file02/{artifact_id}/file02.xlsx · …/dataset/{artifact_id}/dataset.parquet', zh: '产出两样：给人看的映射表 Excel，和给机器用的标准化数据集；都标内部专用' },
    { name: 'clarification external_action (PREPARED)', dir: 'Out', shape: '{action_type:"mail_clarification", deal_id, run_id, in_reply_to: immutable_message_id, to:[sender], cc:[shared mailbox], subject, body_html, missing_items[], state:"PREPARED", approval_scope:"CLARIFICATION_MAIL"}', example: '{"action_type":"mail_clarification","to":["rm.smith@bank.example"],"cc":["paymode-pricing@bottomline.com"],"subject":"Re: Paymode pricing request – ACME Corp","state":"PREPARED"}', zh: '一封“准备好但没发”的追问邮件；分析师在 FE-06 点确认后才由 WF-10 真正发出' }
  ],

  data: [
    { store: 'RDS', object: 'source_messages · source_events', op: 'W', keys: 'UNIQUE (tenant_id, connection_id, mailbox_id, immutable_message_id); idx conversation_id', note: 'raw_eml_artifact_id, deal_id', zh: '收到的邮件和 webhook 事件；唯一键 = 去重的根本' },
    { store: 'RDS', object: 'deals · input_revisions', op: 'W', keys: 'deals.revision (optimistic); UNIQUE (deal_id, revision)', note: 'input manifest = artifact ids + mapping_version + assumptions_version + hash', zh: '一个 deal 可以有多轮输入；每一轮不可改，只能加新一轮' },
    { store: 'RDS', object: 'dataset_rows', op: 'W', keys: 'UNIQUE (tenant_id, dataset_artifact_id, vendor_row_id)', note: 'typed fields (NUMERIC amounts), source_row_ref', zh: '标准化后的每一行；后面分类、生成都从这里读' },
    { store: 'RDS', object: 'assumptions · issues · stage_results', op: 'W', keys: 'issues (run_id, code, blocking); UNIQUE stage_results (run_id, stage, scope_key, input_hash)', note: 'assumption.source ∈ source_data | default | analyst | approver', zh: '假设、问题、阶段结果三张表；假设一定写明来源和审批状态' },
    { store: 'S3', object: 'sources/…/raw.eml · quarantine/… · normalized/…/file02.xlsx · normalized/…/dataset.parquet', op: 'R/W', keys: 'tenants/{t}/deals/{d}/runs/{r}/{kind}/{artifact_id}/{safe_name}', note: 'sha256 from bytes; ETag never used', zh: '原始邮件、隔离区附件、File 2、数据集的存放位置' }
  ],

  config: [
    { key: 'intake.header_scan_rows', value: '8', source: 'demo parseVendorFile.ts', note: 'rows scanned to find header', zh: '在前几行里找表头' },
    { key: 'intake.mapping.auto_accept_confidence', value: '0.90', source: 'blueprint v0.1', note: 'below → FE-05 review', zh: 'AI 对列名的把握低于这个就送人确认' },
    { key: 'intake.required_fields', value: 'Vendor Name, Payment Amt, Address Line 1, City, State', source: 'backend/rules.ts (R-IN-01)', note: 'aliases per bank in mapping profile', zh: '五个必填列；各银行叫法不同，别名写在映射配置里' },
    { key: 'intake.default_analysis_period_months', value: '12', source: 'process map Step 1 (R-IN-02)', note: 'recorded as assumption, approval pending', zh: '没有付款日期时默认按 12 个月分析，但要记成待批假设' },
    { key: 'intake.default_payment_type', value: 'Check', source: 'process map Step 1 (R-IN-03)', note: 'assumption', zh: '没有支付类型时默认支票，同样记成假设' },
    { key: 'intake.sensitive_fields', value: 'Bank Account, Routing, TIN/EIN, SSN (regex + alias detection)', source: 'blueprint v0.1', note: 'never sampled to LLM; excluded from File 4 allowlist', zh: '这些列的内容永远不给 AI 看，也不出现在 File 4 里' },
    { key: 'upload.limits', value: '25 MB/file · 100 MB/request · 50,000 rows', source: 'v1 text §14.1', note: 'dev limits; production per tenant config', zh: '文件大小和行数上限；生产按租户配置' }
  ],

  controls: [
    { type: 'Idempotency', rule: 'same immutable message id never creates a second deal / run', binding: 'source_messages UNIQUE key', note: 'T-01', zh: '同一封邮件不管通知来多少次，只建一个 deal、一个 run' },
    { type: 'Data minimization', rule: 'LLM context = subject, body text, header names, masked samples only', binding: 'field allowlist per task in CORE-08', note: 'no bank account / TIN', zh: '给 AI 的只有邮件文字、表头和脱敏样本，没有账号 / 税号' },
    { type: 'Human gate', rule: 'clarification email requires analyst confirm before send (v1 policy)', binding: 'external_action approval scope CLARIFICATION_MAIL', note: 'auto-send only via versioned policy flag', zh: '追问邮件必须有人点确认才发；以后要自动发也得走带版本的策略开关' },
    { type: 'Loop guard', rule: 'ignore messages sent by the system identity / carrying X-DealOS-Action header', binding: 'CONN-01 filter', note: 'prevents self-trigger', zh: '系统自己发的邮件不会再触发系统（防止自己跟自己对话）' },
    { type: 'Versioning', rule: 'new attachment → new input revision → old run SUPERSEDED, never mutated', binding: 'input_revisions immutable', note: '', zh: '新文件 = 新一轮；旧的一轮只标作废，不改内容' },
    { type: 'Quarantine', rule: 'attachments are scanned before becoming artifacts; REJECTED never reaches parser / model / engine', binding: 'artifacts.readiness', note: 'T-11', zh: '附件先过安检；没过的文件任何模块都碰不到' }
  ],

  acceptance: [
    { case: 'Duplicate notification ×100', given: 'same Graph resource id delivered repeatedly', expected: 'one source_message, one deal, one run (T-01)', zh: '同一通知重复一百次，结果只有一套' },
    { case: 'Header on row 3, two sheets', given: 'JPM-style file with summary sheet + data sheet', expected: 'data sheet chosen, header_row = 3, mapping ≥ 0.9 for required fields', zh: '带汇总页的文件能选对数据页、找对第 3 行表头' },
    { case: 'Missing Vendor Name', given: 'no name-like column', expected: 'BLOCKING → WAITING_INPUT; clarification draft to sender + cc mailbox; nothing sent until confirmed', zh: '缺供应商名 → 阻塞并起草追问，人不确认就不发' },
    { case: 'Bank account column present', given: 'column "Acct #"', expected: 'mapped as sensitive; not in T2 samples; excluded from File 4', zh: '账号列被识别为敏感，AI 看不到样本，File 4 里没有它' },
    { case: 'Reply with new file', given: 'bank replies in same thread with attachment', expected: 'input revision 2; run 1 SUPERSEDED; run 2 starts at intake', zh: '银行回信带新文件 → 开新一轮，旧一轮作废' },
    { case: 'Bad amounts', given: 'cells "N/A", "1,2O0.00" (letter O), blank', expected: 'cell errors listed in IntakeReport; never coerced to 0 (T-03)', zh: '金额格里的坏数据被列出来，不会被悄悄当成 0' },
    { case: 'Unknown sender domain', given: 'mail from a domain not in bank_channel', expected: 'deal created in UNASSIGNED channel + NEEDS_TRIAGE issue; no AI mapping until triaged', zh: '不认识的发件方 → 先让人认领，再继续' }
  ],

  decisions: [
    { decision: 'Auto-send clarification emails without analyst confirm?', options: 'always confirm | auto for missing-field template only | auto', recommendation: 'confirm in v1; per-bank flag later', owner: 'Bottomline (BL-05)', status: 'pending', zh: '追问邮件要不要人确认再发？建议 v1 一律确认，以后按银行开自动' },
    { decision: 'Create Salesforce pricing record at intake or at release?', options: 'intake (early link) | release', recommendation: 'read / link at intake if the record exists; create only if BL-01 allows', owner: 'Bottomline (BL-01)', status: 'pending', zh: '收件时就去 Salesforce 建记录还是只挂已有记录？建议只挂已有的，建记录要 Bottomline 允许' }
  ],

  deploy: [
    { item: 'Repo path', value: 'services/worker/dealos_worker/handlers/intake/', zh: '代码放在 worker 服务下的 intake 目录' },
    { item: 'Entry / registration', value: 'dealos_worker.handlers.intake:IntakeHandler — HANDLER_REGISTRY["intake.fetch_message" | "intake.process" | "intake.resume"]', zh: '一个入口类登记三种任务类型' },
    { item: 'Container image', value: 'dealos-worker:{git_sha} (shared image; WORKER_POOL=standard)', zh: '和其他 handler 共用 worker 镜像' },

    '        return TaskResult(transition=Transition("noop"))',
    '',
    '    # ---------------- 步骤 6–10：解析、映射、校验、写出、追问 ----------------',

    '        report: IntakeReport = IntakeValidator(self.validators, ruleset).validate(parsed, mapping)               # 步骤 8 · IF-115',
    '        candidates = DatasetWriter(self.artifacts).write(task.run_id, parsed, mapping)                            # 步骤 9 · IF-110（先写 S3 候选对象）',
    '        with self.db.tx(task.tenant_id) as tx:                                                                     # IF-111',
    '            tx.register_artifacts(candidates, audience="INTERNAL")',
    '            tx.load_dataset_rows(candidates.dataset_id, parsed.rows(mapping))',

    '    def _resume(self, task: Task, lease: Lease) -> TaskResult:',
    '        msg = self.db.source_message_by_id(task.input_manifest["message_id"])',

    '            tx.attach_reply_to_open_issue(msg.deal_id, msg.id)',
    '        return TaskResult(transition=Transition("noop"))',
    '',

    '        return TaskResult(transition=Transition("review_required", stage="intake"))   # run → WAITING_REVIEW（FE-05）'

  skeleton: [
    '"""WF-02 · Cleansing handler (File 2 → File 3, File 4)',
    '',
    '入口：worker-standard 领到 clean.submit / clean.poll / clean.collect 后调用 handle()。',
    '原则：同一清单只提交一次；清洗前后必须对得上账；File 4 只带白名单列；超时交人不自动重提。',
    '"""',
    'from __future__ import annotations',
    '',
    'from dealos_worker.runtime import Task, Lease, TaskResult, Transition        # CORE-02',
    'from dealos_worker.registries import Registries                              # CORE-11',
    'from dealos_worker.validators import Validators                              # CORE-09',
    'from dealos_worker.storage import Db, Artifacts                              # PLAT-04 / PLAT-05',
    'from dealos_worker.connectors.alteryx import AlteryxAdapter                  # CONN-02 ExternalProcessingAdapter',
    'from dealos_worker.errors import ReconcileError, SensitiveColumnError',

    'from .reconciler import PopulationReconciler    # 零件 5',
    'from .allowlist import ExportAllowlist          # 零件 6',
    'from .writer import File4Writer                 # 零件 7',
    '',
    'POLL_MIN_S, POLL_MAX_S = 30, 300     # 轮询间隔 30 秒 → 5 分钟',
    'DEADLINE_H = 4                       # 业务截止：4 小时没结果交人',
    '',
    '',
    'class CleansingHandler:',
    '    """零件 1 总调度。调适配器 / S3 期间不持有数据库事务。"""',
    '',
    '    def __init__(self, db: Db, artifacts: Artifacts, registries: Registries, validators: Validators, adapter: AlteryxAdapter):',
    '        self.db, self.artifacts, self.registries, self.validators, self.adapter = db, artifacts, registries, validators, adapter',
    '',
    '    def handle(self, task: Task, lease: Lease) -> TaskResult:',
    '        """步骤 1：分流。"""',
    '        return {"clean.submit": self._submit, "clean.poll": self._poll, "clean.collect": self._collect}[task.kind](task, lease)',
    '',
    '    def _submit(self, task: Task, lease: Lease) -> TaskResult:',
    '        conn = self.registries.connection(task.input_manifest["connection_id"])',
    '        manifest = CleanManifestBuilder(self.db, conn).build(task.run_id, task.input_manifest)          # 步骤 2 · 清单 + 哈希',
    '        cap = self.adapter.validate_configuration(conn)                                                 # 看这条连接支持什么模式',
    '        if cap.mode == "operator":',
    '            job = AlteryxSubmitter(self.adapter, self.db).create_operator_handoff(task, manifest)         # → FE-07 下载 File 2',
    '        else:',
    '            job = AlteryxSubmitter(self.adapter, self.db).submit(task, manifest, conn)                   # 步骤 3 · IF-120（先 reconcile_submission 再提）',
    '        with self.db.tx(task.tenant_id) as tx:',
    '            tx.insert_external_job(job, deadline_h=DEADLINE_H, next_poll_s=POLL_MIN_S)',
    '        return TaskResult(transition=Transition("waiting_external", stage="clean"))',
    '',
    '    def _poll(self, task: Task, lease: Lease) -> TaskResult:',
    '        job = self.db.external_job(task.input_manifest["external_job_id"])',
    '        status = JobPoller(self.adapter).status(job)                                                    # 步骤 4 · IF-120',
    '        with self.db.tx(task.tenant_id) as tx:',
    '            tx.append_job_status(job.id, status)',
    '            if status.completed:',
    '                tx.enqueue(task.run_id, "clean.collect", {"external_job_id": job.id})',
    '            elif status.error:',
    '                tx.raise_issue(task.run_id, "EXTERNAL_ERROR", detail=status.message, blocking=True)     # → WAITING_OPERATOR',
    '            elif tx.now() > job.deadline_at:',
    '                tx.raise_issue(task.run_id, "EXTERNAL_TIMEOUT", blocking=True); tx.create_operator_task(job)   # 不自动重提',
    '            else:',
    '                tx.schedule_next_poll(job.id, JobPoller.backoff(job.poll_count, POLL_MIN_S, POLL_MAX_S))',
    '        return TaskResult(transition=Transition("noop"))',
    '',
    '    def _collect(self, task: Task, lease: Lease) -> TaskResult:',
    '        job = self.db.external_job(task.input_manifest["external_job_id"])',
    '        if self.db.run_status(task.run_id) in ("SUPERSEDED", "CANCELLED"):                             # 迟到的结果只记旧 run',
    '            AlteryxSubmitter(self.adapter, self.db).archive_late_result(job); return TaskResult(transition=Transition("noop"))',
    '        file03 = AlteryxSubmitter(self.adapter, self.artifacts).collect(job)                            # 步骤 5 · IF-120 / IF-121',
    '        lease.heartbeat()',
    '        file02 = self.artifacts.load_table(task.input_manifest["file02_artifact_id"])',
    '        lineage = PopulationReconciler(self.validators).reconcile(file02, file03)                       # 步骤 6 · IF-122（R-CLN-02/03）',
    '        if lineage.unexplained:',
    '            with self.db.tx(task.tenant_id) as tx:',
    '                tx.register_artifact(file03, kind="file03", audience="INTERNAL")',
    '                tx.raise_issue(task.run_id, "UNEXPLAINED_DIFF", detail=lineage.unexplained, blocking=True)',
    '            return TaskResult(transition=Transition("stage_blocked", stage="clean"))',
    '        allow = self.registries.export_allowlist(task.input_manifest["allowlist_version"])',
    '        file04 = File4Writer(self.artifacts).write(task.run_id, ExportAllowlist(allow).apply(file03))     # 步骤 7–8 · IF-122 / IF-121',
    '        if file04.rows != file03.rows:',
    '            raise ReconcileError("File 4 row count differs from File 3")',
    '        with self.db.tx(task.tenant_id) as tx:',
    '            tx.register_artifact(file03, kind="file03", audience="INTERNAL")',
    '            tx.register_artifact(file04, kind="file04", audience="INTERNAL", parent=file03.artifact_id)',
    '            tx.stage_result(task.run_id, "clean", checks=lineage.summary())',
    '        return TaskResult(artifacts=[file03.artifact_id, file04.artifact_id], transition=Transition("stage_passed", stage="clean"))   # → roc.submit'
  ].join('\n')
};

    '    def _qa(self, task: Task, lease: Lease) -> TaskResult:',

    '        with self.db.tx(task.tenant_id) as tx:                                                     # 步骤 8 · IF-146',

    '                plan = RepairPlanner(self.agent, self.engine, PERMITTED_FIXES).plan(cand, findings)  # 步骤 6 · IF-143；越权 → 整体拒绝 → 变 BLOCK',
    '                if plan is None:',
    '                    verdict = "BLOCK"',
    '                else:',
    '                    tx.save_plan(plan); tx.enqueue(task.run_id, "repair.apply", {"candidate": m["candidate"], "plan_id": plan.id, "round": rnd})',
    '                    return TaskResult(transition=Transition("noop"))',
    '            if verdict == "BLOCK":',
    '                tx.raise_issue(task.run_id, "QA_BLOCK" if rnd < MAX_REPAIR_ROUNDS else "QA_REPAIR_LIMIT", detail=findings, blocking=True)',
    '                return TaskResult(transition=Transition("review_required", stage="qa"))         # → FE-10',
    '        return TaskResult(transition=Transition("stage_passed", stage="qa"))                    # PASS → release.package',

    '                                                    "approved_numbers": m.get("approved_numbers"), "disclosures": m.get("disclosures")})',
    '        return TaskResult(artifacts=new_cand.artifact_ids, transition=Transition("noop"))'

    '            tx.set_dispatch_flag(pool, paused, reason)                                           # CORE-03 每轮检查这个开关',

    '    @audited("ops.action.reconcile")',
    '    def reconcile_action(self, actor: ActorContext, action_id: str, resolution: str = "auto", reason: str = ""):   # 步骤 5',

    '        action = self.db.external_action(action_id)',
    '        if resolution == "auto":',
    '            return connector_for(action.connection_id).readback(action)                         # 邮件查 Sent Items；CRM GET 比对；绝不重发',

    '            return tx.set_action_state(action_id, {"mark_confirmed": "CONFIRMED", "mark_failed": "FAILED_PERMANENT"}[resolution], manual=True, reason=reason)',

    '',

    '',

    '',
    'class TaskRuntime:',
    '    def __init__(self, db: Db, sqs: Sqs):',
    '        self.db, self.sqs = db, sqs',
    '',
    '    # ---------- 零件 1：登记（在调用方事务里） ----------',
    '    def enqueue_task_tx(self, tx: Tx, run_id: str, kind: str, manifest: dict, pool: str, scope_key: str = "ROOT", due_at: datetime | None = None):',
    '        digest = hashlib.sha256(json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode()).hexdigest()',
    '        task = tx.insert_task_on_conflict_nothing(run_id, kind, scope_key, digest, pool, handler_version=tx.handler_version(kind), due_at=due_at)   # IF-083',
    '        if task.created:',
    '            tx.insert_task_directory(task.id, tx.tenant_id, task.handler_version)',
    '            tx.insert_outbox(task.id, dispatch_generation=1, available_at=due_at or tx.now())     # 派发器会把它送进队列',
    '        return task                                                                              # 同键返回已有任务（幂等）',
    '',
    '    # ---------- 零件 2：领取 ----------',
    '    def claim_task(self, envelope: dict, worker_id: str, receipt: str):',
    '        d = self.db.task_directory(envelope["task_id"])                                         # 租户来自目录，不信消息',
    '        with self.db.tx(d.tenant_id) as tx:',
    '            t = tx.task(envelope["task_id"])',
    '            if envelope["dispatch_generation"] < t.dispatch_generation or t.terminal:',
    '                self.sqs.ack(receipt); return None                                                # 旧消息 / 已结束：确认并丢弃',
    '            row = tx.execute("UPDATE tasks SET state=RUNNING, lease_owner=:w, lease_expires_at=now()+:l, fence=fence+1 "',

    '            if row is None:',
    '                if t.state == "RUNNING" and t.lease_expires_at < tx.now() and t.kind not in EXTERNAL_WRITE_KINDS:',
    '                    row = tx.reclaim(t.id, worker_id, LEASE_S)                                    # 过期且内部任务 → 接管',

    '        n = self.db.execute("UPDATE tasks SET lease_expires_at=now()+:l WHERE id=:id AND fence=:f", l=timedelta(seconds=LEASE_S), id=task_id, f=fence).rowcount',
    '        if n: self.sqs.extend_visibility(receipt, 120)',
    '        return n == 1',
    '',
    '    # ---------- 零件 4：提交 ----------',
    '    def complete_task_tx(self, tx: Tx, task_id: str, fence: int, result, controller):',
    '        t = tx.task_for_update(task_id)',
    '        if t.fence != fence or tx.run_status(t.run_id) in ("CANCELLED", "SUPERSEDED"):',
    '            tx.metric("tasks.stale_commit"); return None                                        # 旧租约 / 已取消：静默丢弃',

    '            tx.register_artifact_from_candidate(c, verify_sha256=True)                           # 候选 → READY',
    '        tx.set_task_state(task_id, "SUCCEEDED")',

    '            controller.transition_run_tx(tx, t.run_id, result.transition, result_refs=result.refs())   # CORE-01 同事务 → 新 outbox 行',
    '',
    '    # ---------- 零件 5：重试 / 租约恢复 ----------',
    '    def schedule_retry_tx(self, tx: Tx, task_id: str, fence: int, error_class: str):',
    '        t = tx.task_for_update(task_id)',
    '        if t.fence != fence: return',
    '        if t.attempts >= RETRY_MAX or error_class == "permanent":',
    '            tx.set_task_state(task_id, "FAILED"); tx.raise_issue(t.run_id, "TASK_FAILED", detail={"kind": t.kind, "error": error_class}); return',
    '        delay = min(30 * 2 ** t.attempts, 900) + random.uniform(0, 5)',
    '        tx.set_task_retry(task_id, due_at=tx.now() + timedelta(seconds=delay), dispatch_generation=t.dispatch_generation + 1)',
    '        tx.insert_outbox(task_id, dispatch_generation=t.dispatch_generation + 1, available_at=tx.now() + timedelta(seconds=delay))',
    '',

    '        n = 0',

    '                else: self.schedule_retry_tx(tx, t.id, t.fence, "lease_expired")',
    '            n += 1',
    '        return n'

    '"""',
    'from __future__ import annotations',

    'import signal, time',

    '',
    'class Dispatcher:',
    '    def __init__(self, db: Db, sqs: Sqs, me: str):',
    '        self.db, self.sqs, self.me, self.stopping, self.backoff = db, sqs, me, False, BACKOFF_MIN',

    '            except Exception as e:                                                             # 绝不 crash-loop',
    '                self.db.log_error("dispatcher.tick", e); n = 0; time.sleep(1)',
    '            self.backoff = BACKOFF_MIN if n else min(self.backoff * 2, BACKOFF_MAX)',
    '            if not n: time.sleep(self.backoff)',

    '    def tick(self) -> int:',

    '            "WHERE o.id = c.id RETURNING o.*, (SELECT pool FROM tasks WHERE id = o.task_id) AS pool",',
    '            lease=f"{LEASE_S} seconds", me=self.me, paused=list(paused), n=BATCH).all()          # 零件 3 · IF-072',

    '        self.db.metric("outbox_oldest_age_s", self.db.outbox_oldest_age())                     # 零件 7',

    'CONCURRENCY = int(os.environ.get("WORKER_CONCURRENCY", "4"))',

    '',
    'class Worker:',
    '    def __init__(self):',
    '        self.c = build_container(POOL)                                                          # 零件 1',
    '        self.registry = build_registry(POOL, self.c)                                            # 零件 5',
    '        assert_pipeline_coverage(POOL, self.registry)                                           # 缺 handler → 启动失败',
    '        self.runtime: TaskRuntime = self.c.runtime',
    '        self.pool = ThreadPoolExecutor(CONCURRENCY); self.slots = threading.Semaphore(CONCURRENCY)',
    '        self.stopping = False; signal.signal(signal.SIGTERM, lambda *_: setattr(self, "stopping", True))',
    '',
    '    def run(self):                                                                              # 零件 2 · IF-077',
    '        while not self.stopping:',
    '            free = CONCURRENCY - (CONCURRENCY - self.slots._value)',
    '            msgs = self.c.sqs.receive(self.c.queue_url, max_messages=min(10, free), wait_s=20, visibility_s=120) if free else []',
    '            for m in msgs:',
    '                self.slots.acquire(); self.pool.submit(self._execute, m)',
    '            self.c.health.touch(in_flight=CONCURRENCY - self.slots._value, stopping=self.stopping)',
    '        self.pool.shutdown(wait=True)                                                           # 零件 6：等手头任务做完再退出',
    '',
    '    def _execute(self, m):                                                                      # 零件 3',

    '            if not claimed: return',
    '            task, lease = claimed',
    '            hb = Heartbeat(lease).start()                                                       # 零件 4',
    '            try:',
    '                result = self.registry[task.kind].handle(task, lease)                           # IF-084..089 → WF-01..05 / WF-09',

    '                    self.runtime.complete_task_tx(tx, task.id, lease.fence, result, self.c.controller)   # 验令牌 + 登记 + 转状态',
    '                self.c.sqs.ack(m.receipt)                                                       # 先提交后确认',
    '            except TransientError as e:',
    '                self._retry(task, lease, "transient", e); self.c.sqs.ack(m.receipt)',
    '            except (PermanentError, PreconditionFailed) as e:',
    '                self._retry(task, lease, "permanent", e); self.c.sqs.ack(m.receipt)',
    '            except LeaseLost:',

    '                hb.stop()',
    '        finally:',
    '            self.slots.release()',
    '',
    '    def _retry(self, task, lease, error_class, e):',
    '        with self.c.db.tx(task.tenant_id) as tx:',
    '            self.runtime.schedule_retry_tx(tx, task.id, lease.fence, error_class)',

    '',
    'class Heartbeat(threading.Thread):',

    '    def __init__(self, lease): super().__init__(daemon=True); self.lease, self._stop = lease, threading.Event()',
    '    def run(self):',
    '        while not self._stop.wait(20):',
    '            try: self.lease.heartbeat()',
    '            except LeaseLost: return',
    '    def stop(self): self._stop.set()',
    '',
    '',
    'if __name__ == "__main__":',
    '    Worker().run()'

    '"""CORE-08 · Agent loop (AI task executor)',
    '',
    '所有 AI 调用的唯一通道。白名单上下文 → 缓存 → 调模型（无工具、温度 0）→ 严格校验（一次修复）→ 全记录。',
    '"""',
    'from __future__ import annotations',
    '',
    'import hashlib, json, re',
    'from dataclasses import dataclass, field',
    'from typing import Any, Callable',
    '',
    'import jsonschema',
    '',
    'from dealos_core.storage import Db, S3',
    'from dealos_core.registries import Registries                 # CORE-11 model_routes / prompt versions',
    'from dealos_core.connectors.model import ModelProvider        # CONN-04',
    'from dealos_core.errors import AIInvalid, AIUnavailable, AIContextViolation',
    '',
    'MASKS = [re.compile(p) for p in (r"\\b\\d{8,17}\\b", r"\\b\\d{2}-\\d{7}\\b", r"[\\w.+-]+@[\\w-]+\\.[\\w.]+", r"\\+?\\d[\\d\\s().-]{8,}\\d")]   # 账号 / EIN / 邮箱 / 电话',

    '',
    '',
    '@dataclass',
    'class TaskDef:                                                 # 零件 2（数据，不是代码）',
    '    task_ref: str; prompt_version: str; system_prompt: str; schema_name: str; schema: dict; route: str',
    '    allowlist: list[str]; band_fields: list[str] = field(default_factory=list); max_tokens: int = 4000',
    '    hook: Callable[[dict, Any], list[str]] | None = None       # 任务特有校验（T4 行数、T8 白名单…）',
    '',
    '',
    'class ContextBuilder:                                          # 零件 3',
    '    def __init__(self, d: TaskDef): self.d = d',
    '    def build(self, payload: dict) -> tuple[dict, str]:',
    '        ctx = self._allowlist(payload, self.d.allowlist)                                        # 白名单以外直接丢',
    '        ctx = self._band(ctx, self.d.band_fields)                                               # 金额 → 区间',
    '        text = json.dumps(ctx, sort_keys=True, separators=(",", ":"), ensure_ascii=False)',
    '        for m in MASKS:',
    '            if m.search(text): raise AIContextViolation(m.pattern)                              # 打码后仍有敏感模式 → 代码 bug，绝不发送',
    '        h = hashlib.sha256((self.d.task_ref + self.d.prompt_version + self.d.schema_name + text).encode()).hexdigest()',
    '        return ctx, h',
    '    def _allowlist(self, obj, paths): ...                                                       # 按路径保留字段（rows[].vendor_name 等）',
    '    def _band(self, obj, fields): ...                                                           # spend_12m → spend_band',
    '',
    '',
    'class AgentLoop:',
    '    """零件 1：入口。"""',
    '    def __init__(self, db: Db, s3: S3, provider: ModelProvider, registries: Registries, taskdefs: dict[str, Callable[[dict], TaskDef]]):',
    '        self.db, self.s3, self.provider, self.registries, self.taskdefs = db, s3, provider, registries, taskdefs',
    '',
    '    def run(self, task_ref: str, payload: dict, schema: str, context_hash: str | None = None, run_versions: dict | None = None, retry: bool = False):',
    '        d = self.taskdefs[task_ref](run_versions or {})                                         # 步骤 2 · 版本锁定',
    '        ctx, h = ContextBuilder(d).build(payload)                                               # 步骤 3',
    '        if not retry and (hit := self.db.ai_cache_get(task_ref, h)):                            # 步骤 4 · IF-097',
    '            return hit',
    '        attempt = self.db.ai_attempt_start(task_ref, h, d)                                      # 步骤 5 · IF-097',
    '        raw = self.provider.invoke_model(route=d.route, system=d.system_prompt, context=ctx, output_schema=d.schema,',
    '                                         temperature=0, max_tokens=d.max_tokens, request_id=attempt.id, timeout_s=60)   # 步骤 6 · IF-096（无工具）',
    '        ok, errs, parsed = self._validate(d, ctx, raw)                                          # 步骤 7',
    '        repaired = False',
    '        if not ok:',
    '            raw = self.provider.invoke_model(route=d.route, system=d.system_prompt, context={"previous": raw, "errors": errs, "instruction": "return corrected JSON only"},',
    '                                             output_schema=d.schema, temperature=0, max_tokens=d.max_tokens, request_id=attempt.id + ":repair", timeout_s=60)',
    '            ok, errs, parsed = self._validate(d, ctx, raw); repaired = True',
    '        self.db.ai_attempt_finish(attempt, raw, parsed if ok else None, ok, errs, repaired)     # 步骤 8 · IF-097',
    '        self.s3.put_json(f"ai/{attempt.tenant_id}/{task_ref}/{attempt.id}.json", {"prompt": d.system_prompt, "context": ctx, "raw": raw, "ok": ok})   # IF-098',
    '        if not ok: raise AIInvalid(errs)                                                        # handler 决定：整批重试 / 转人工，绝不部分采纳',
    '        self.db.ai_cache_put(task_ref, h, parsed)',
    '        return parsed                                                                           # 步骤 9',
    '',
    '    def _validate(self, d: TaskDef, ctx: dict, raw: dict):                                      # 零件 6',
    '        errs: list[str] = []',
    '        try: jsonschema.validate(raw, d.schema)',
    '        except jsonschema.ValidationError as e: errs.append(f"schema: {e.message}")',
    '        errs += check_enums(raw, ctx); errs += check_evidence_refs(raw, ctx)                    # 枚举 / 证据引用 ⊆ 我们给过的',
    '        if d.hook and not errs: errs += d.hook(ctx, raw)                                        # T4：行集合相等；T8：动作白名单；T6/T7：位置存在；T1：引用是原文子串',
    '        return (not errs), errs, (to_typed(d.schema_name, raw) if not errs else None)',
    '',
    '',
    'def check_enums(raw, ctx) -> list[str]: ...',
    'def check_evidence_refs(raw, ctx) -> list[str]: ...',
    'def to_typed(schema_name: str, raw: dict): ...                                                  # pydantic 模型'
  ].join('\n')
};

    '"""',
    'from __future__ import annotations',
    '',
    'import contextvars, json, re, sys, time',
    'from functools import wraps',
    '',
    'from dealos_core.storage import Tx',
    '',
    'FORBIDDEN = {"body", "content", "html", "rows", "dataset", "account", "routing", "tin", "ein", "ssn", "secret", "token", "password", "authorization", "cookie"}',
    'MASK = re.compile(r"\\b\\d{8,17}\\b")',
    'DETAIL_CAP = 8192',
    '_ctx: contextvars.ContextVar[dict] = contextvars.ContextVar("dealos_ctx", default={})',
    '',
    '',
    'class RequestContext:                                          # 零件 1',
    '    @staticmethod',
    '    def set(**ids): _ctx.set({**_ctx.get(), **{k: v for k, v in ids.items() if v is not None}})',
    '    @staticmethod',

    '',
    '',
    'class Redactor:                                                # 零件 3',
    '    @classmethod',
    '    def apply(cls, obj):',
    '        if isinstance(obj, dict): return {k: ("[redacted]" if k.lower() in FORBIDDEN else cls.apply(v)) for k, v in obj.items()}',
    '        if isinstance(obj, list): return [cls.apply(v) for v in obj]',
    '        if isinstance(obj, str): return MASK.sub("[num]", obj)',
    '        return obj',
    '',
    '',
    'class Audit:                                                   # 零件 2',
    '    def record(self, tx: Tx, actor, action: str, object_type: str, object_id: str, before_revision=None, after_revision=None, detail: dict | None = None):',
    '        c = RequestContext.get()',
    '        d = json.dumps(Redactor.apply(detail or {}))',
    '        if len(d) > DETAIL_CAP: d = json.dumps({"truncated": True, "head": d[:DETAIL_CAP]})',
    '        tx.execute("INSERT INTO audit_events (tenant_id, actor_id, actor_type, action, object_type, object_id, before_revision, after_revision, request_id, detail, service, at) "',
    '                   "VALUES (:t, :a, :at, :ac, :ot, :oi, :b, :af, :r, :d, :s, now())",',
    '                   t=tx.tenant_id, a=getattr(actor, "id", "system"), at=getattr(actor, "type", "system"), ac=action, ot=object_type, oi=object_id,',
    '                   b=before_revision, af=after_revision, r=c.get("request_id"), d=d, s=c.get("service"))   # IF-099 · INSERT only；失败则整个事务回滚',
    '',
    '',
    'def audited(action: str):                                      # WF-12 等用的装饰器',
    '    def deco(fn):',
    '        @wraps(fn)',
    '        def wrapper(self, actor, target_id, *a, **kw):',
    '            before = self.db.snapshot(target_id)',
    '            result = fn(self, actor, target_id, *a, **kw)',
    '            with self.db.tx(actor.tenant_id) as tx:',
    '                Audit().record(tx, actor, action, "ops_target", target_id, detail={"before": before, "after": self.db.snapshot(target_id), "reason": kw.get("reason")})',
    '            return result',
    '        return wrapper',
    '    return deco',
    '',
    '',
    'class Log:                                                     # 零件 4：JSON 行日志',
    '    def __init__(self, service: str): self.service = service; RequestContext.set(service=service)',
    '    def _emit(self, level, msg, **fields):',
    '        line = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "level": level, "msg": msg, **RequestContext.get(), **Redactor.apply(fields)}',
    '        sys.stdout.write(json.dumps(line, ensure_ascii=False) + "\\n")                          # → CloudWatch Logs（IF-217）',
    '    def info(self, msg, **f): self._emit("info", msg, **f)',
    '    def warning(self, msg, **f): self._emit("warning", msg, **f)',
    '    def error(self, msg, **f): self._emit("error", msg, **f)',
    '',
    '',
    'def metric(name: str, value: float, unit: str = "Count", **dims):   # 零件 5：EMF',
    '    dims = {k: str(v) for k, v in dims.items() if k in ("service", "pool", "tenant_id", "kind")}   # 维度受控',
    '    block = {"_aws": {"Timestamp": int(time.time() * 1000), "CloudWatchMetrics": [{"Namespace": "DealOS", "Dimensions": [list(dims)], "Metrics": [{"Name": name, "Unit": unit}]}]}, **dims, name: value}',
    '    sys.stdout.write(json.dumps(block) + "\\n")'
  ].join('\n')
};

    '',

    '"""',
    'from __future__ import annotations',
    '',
    'import hashlib, json, time',
    '',
    'from dealos_core.storage import Db, S3',
    'from dealos_core.audit import Audit',
    'from dealos_core.auth import ActorContext, authorize',
    'from dealos_core.errors import ConfigMissing, PublishRejected',

    'CACHE_TTL_S, SECRET_TTL_S = 60, 300',
    '',
    '',
    'class Cache:                                                   # 零件 7',
    '    def __init__(self): self.d = {}',
    '    def get(self, key, ttl=None):',
    '        v = self.d.get(key)',
    '        if v and (ttl is None or time.time() - v[1] < ttl): return v[0]',
    '    def put(self, key, val): self.d[key] = (val, time.time())',
    '',
    '',
    'class SecretResolver:                                          # 零件 6',
    '    def __init__(self, client): self.client, self.cache = client, Cache()',
    '    def get(self, secret_ref: str):',
    '        if (v := self.cache.get(secret_ref, SECRET_TTL_S)) is not None: return v',
    '        v = self.client.get_secret_value(SecretId=secret_ref)["SecretString"]              # IF-101；只在内存，绝不落库 / 记日志',
    '        self.cache.put(secret_ref, v); return v',
    '',
    '',
    'class Registries:',
    '    """零件 1 + 2：按版本取配置；current 指针 60 秒缓存；版本条目永不过期。"""',
    '    def __init__(self, db: Db, secrets: SecretResolver, s3: S3, audit: Audit):',
    '        self.db, self.secrets, self.s3, self.audit, self.cache = db, secrets, s3, audit, Cache()',
    '',
    '    def _versioned(self, kind: str, version: str):',
    '        if (v := self.cache.get((kind, version))) is not None: return v',
    '        row = self.db.config_version(kind, version)                                          # IF-100',
    '        if row is None: raise ConfigMissing(kind, version)                                   # 绝不回退到 latest',
    '        obj = SCHEMAS[kind].model_validate(row.payload); self.cache.put((kind, version), obj); return obj',
    '',
    '    def ruleset(self, version):          return self._versioned("ruleset", version)          # IF-129 等',
    '    def template_set(self, version):     return self._versioned("template_set", version)     # IF-136',
    '    def mapping_profile(self, version):  return self._versioned("mapping_profile", version)  # IF-116',
    '    def model_routes(self, version):     return self._versioned("model_routes", version)',
    '    def crm_mapping(self, version):      return self._versioned("crm_mapping", version)',
    '    def export_allowlist(self, version): return self._versioned("export_allowlist", version)',
    '',
    '    def current(self, kind: str, tenant_id: str) -> str:',
    '        key = ("current", kind, tenant_id)',
    '        if (v := self.cache.get(key, CACHE_TTL_S)) is not None: return v',
    '        v = self.db.config_current(kind, tenant_id)',
    '        if v is None: raise ConfigMissing(kind, "current")',
    '        self.cache.put(key, v); return v',
    '',
    '    def connection(self, connection_id: str):',
    '        row = self.db.integration_connection(connection_id)                                  # 只有 secret_ref',
    '        return row.with_secret_getter(lambda: self.secrets.get(row.secret_ref))               # 连接器需要时再取',
    '',
    '    def bank_channel(self, deal_id: str): return self.db.bank_channel_for_deal(deal_id)',
    '',
    '',
    'class Publisher:                                               # 零件 3',
    '    def __init__(self, db: Db, s3: S3, audit: Audit): self.db, self.s3, self.audit = db, s3, audit',
    '',
    '    def publish(self, actor: ActorContext, kind: str, payload: dict, notes: str) -> str:',
    '        authorize(actor, "config.publish")',
    '        obj = SCHEMAS[kind].model_validate(payload)                                          # 结构校验',
    '        errors = PUBLISH_CHECKS[kind](obj, self.s3, self.db)                                 # 深度校验：模板哈希 / slide_map / 别名唯一 / 批准模型…',
    '        if errors: raise PublishRejected(errors)                                             # 422，什么都不写',
    '        sha = hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()).hexdigest()',
    '        with self.db.tx(actor.tenant_id) as tx:',
    '            version = tx.insert_config_version(kind, payload, sha, actor.id, notes)          # 不可改的新行（IF-100）',
    '            tx.set_config_current(kind, version)                                             # 移指针；正在跑的 run 不受影响',
    '            self.audit.record(tx, actor, "config.published", kind, version, detail={"sha256": sha, "notes": notes})',
    '        return version',
    '',
    '    def rollback(self, actor: ActorContext, kind: str, to_version: str) -> str:',
    '        old = self.db.config_version(kind, to_version)',
    '        return self.publish(actor, kind, old.payload, notes=f"rollback to {to_version}")      # 回滚 = 再发布一次'
  ].join('\n')
};

      var code = nextNodeCode(tier), n = { id: code, code: code, name: 'New module', tier: tier, kind: tier === 'frontend' ? 'ui' : tier === 'api' ? 'api' : tier === 'workflow' ? 'handler' : tier === 'ai' ? 'ai-task' : tier === 'connectors' ? 'connector' : tier === 'external' ? 'external-system' : tier === 'people' ? 'human' : tier === 'platform' ? 'store' : 'service', owner: 'DealOS', buildBuy: 'build', status: 'proposed', component: '', runtime: '', purpose: '', zh: '', steps: ['*'], gates: [], x: mx ? mx + 32 : X0, y: tierNodeY(tier), w: NODE_W, h: NODE_H, spec: {}, notes: '' };
      SPEC_KEYS.forEach(function (k) { n.spec[k] = []; }); n.spec.blueprint = { stack: '', codeHome: '', trigger: '', output: '', parts: [], steps: [] }; n.spec.skeleton = '';
      model.nodes.push(n); index(model); if (n.x + n.w + 40 > model.canvas.w) model.canvas.w = n.x + n.w + 40; select('node', n.id, { scroll: true }); $('#rail input[data-f=name]').focus();
    });
    $('#btnConnect').addEventListener('click', function () { if (connectMode) exitConnect('cancelled'); else enterConnect(); });
    $('#btnDelete').addEventListener('click', function () {
      if (!sel) return hint('Select a module or interface first');
      if (sel.type === 'node') { var n = byId[sel.id], es = edgesOf(n.id); if (!confirm('Delete module ' + n.code + ' and its ' + es.length + ' interface(s)?')) return; model.nodes = model.nodes.filter(function (x) { return x !== n; }); model.edges = model.edges.filter(function (e) { return e.from.node !== n.id && e.to.node !== n.id; }); }
      else { var e = edgeById[sel.id]; if (!confirm('Delete interface ' + e.id + '?')) return; model.edges = model.edges.filter(function (x) { return x !== e; }); }
      index(model); clearSel();
    });
    var menu = $('#menuExport'); menu.querySelector('.btn').addEventListener('click', function (ev) { ev.stopPropagation(); menu.classList.toggle('open'); });
    document.addEventListener('click', function (ev) { if (!ev.target.closest('#menuExport')) menu.classList.remove('open'); });
    menu.addEventListener('click', function (ev) { var b = ev.target.closest('button[data-export]'); if (!b) return; menu.classList.remove('open'); doExport(b.dataset.export); });
    $('#btnSave').addEventListener('click', saveHtml);
    $('#fileImport').addEventListener('change', function (ev) {
      var f = ev.target.files[0]; if (!f) return; var rd = new FileReader();
      rd.onload = function () { try { var m = JSON.parse(rd.result); if (!m.nodes || !m.edges) throw new Error('missing nodes/edges'); model = normalize(m); sel = null; paintChips(); render(); paintRail(); paintDrawer(); hint('Model imported: ' + model.nodes.length + ' modules, ' + model.edges.length + ' interfaces'); } catch (e) { alert('Import failed: ' + e.message); } ev.target.value = ''; };
      rd.readAsText(f);
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { if (connectMode) exitConnect('cancelled'); else if (sel && !ev.target.closest('input,textarea,[contenteditable]')) clearSel(); }
      if ((ev.key === 'Delete') && sel && !ev.target.closest('input,textarea,[contenteditable]')) $('#btnDelete').click();
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); saveHtml(); }
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'f' && !ev.shiftKey) { ev.preventDefault(); $('#search').focus(); }
    });
    // resizers
    dragResizer($('#railResizer'), function (ev) { var w = Math.max(280, Math.min(900, window.innerWidth - ev.clientX)); document.documentElement.style.setProperty('--rail-w', w + 'px'); });
    dragResizer($('#drawerResizer'), function (ev) { var main = $('#sheet-blueprint').getBoundingClientRect(); var h = Math.max(80, Math.min(main.height - 120, main.bottom - ev.clientY)); document.documentElement.style.setProperty('--drawer-h', h + 'px'); });
    window.addEventListener('beforeunload', function () { /* edits live only in the page until Save as HTML */ });
  }
  function dragResizer(el, onMove) {
    el.addEventListener('mousedown', function (ev) { ev.preventDefault(); var mv = function (e) { onMove(e); }, up = function () { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); }; window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up); });
  }

  // ---------- persistence & exports ----------
  function serializeModel() { return JSON.stringify(model).replace(/<\//g, '<\\/').replace(/<!--/g, '<\\!--'); }
  function saveHtml() {
    var holder = $('#blueprint-model'); holder.textContent = serializeModel();
    var svg = $('#svg'), rail = $('#rail'), drawer = $('#drawer'), reg = $('#regBody'), keep = [svg.innerHTML, rail.innerHTML, drawer.innerHTML, reg.innerHTML];
    svg.innerHTML = ''; rail.innerHTML = ''; drawer.innerHTML = ''; reg.innerHTML = '';
    var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    svg.innerHTML = keep[0]; rail.innerHTML = keep[1]; drawer.innerHTML = keep[2]; reg.innerHTML = keep[3];
    var name = 'DealOS_Engineering_Blueprint_' + new Date().toISOString().slice(0, 10) + '.html';
    download(name, html, 'text/html;charset=utf-8'); hint('Saved ' + name + ' — replace the original file with it to keep your edits');
  }
  function doExport(kind) {
    if (kind === 'import') { $('#fileImport').click(); return; }
    if (kind === 'json') { download('dealos_blueprint_model.json', JSON.stringify(model, null, 2), 'application/json'); return; }
    if (kind === 'csv') { download('dealos_interfaces.csv', interfacesCsv(), 'text/csv;charset=utf-8'); return; }
    if (kind === 'md') { download('DealOS_Engineering_Spec.md', specMarkdown(), 'text/markdown;charset=utf-8'); return; }
  }
  function csvCell(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function interfacesCsv() {
    var cols = ['id', 'from', 'to', 'kind', 'label', 'steps'].concat(EDGE_FIELDS.map(function (f) { return f[0]; })), lines = [cols.join(',')];
    model.edges.forEach(function (e) { lines.push([e.id, e.from.node, e.to.node, e.kind, e.label, stepsText(e.steps)].concat(EDGE_FIELDS.map(function (f) { return e.spec[f[0]] || ''; })).map(csvCell).join(',')); });
    return '\ufeff' + lines.join('\n');
  }
  function mdCell(v) { return String(v == null ? '' : v).replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>'); }
  function mdTable(cols, rows) { if (!rows.length) return '_none_\n'; var out = ['| ' + cols.map(function (c) { return c[1]; }).join(' | ') + ' |', '|' + cols.map(function () { return '---'; }).join('|') + '|']; rows.forEach(function (r) { out.push('| ' + cols.map(function (c) { return mdCell(r[c[0]]); }).join(' | ') + ' |'); }); return out.join('\n') + '\n'; }
  function nodeMarkdown(n, full) {
    var o = ['#### ' + n.code + ' · ' + n.name, ''];
    if (n.zh) o.push('> ' + mdCell(n.zh), '');
    o.push('| Field | Value |', '|---|---|', '| Kind | ' + n.kind + ' |', '| Tier | ' + tierOf(n.tier).label + ' |', '| Owner | ' + n.owner + ' |', '| Build/buy | ' + n.buildBuy + ' |', '| Status | ' + n.status + ' |', '| Component | ' + mdCell(n.component) + ' |', '| Runtime | ' + mdCell(n.runtime) + ' |', '| Steps | ' + stepsText(n.steps) + ' |', '| Gates | ' + n.gates.join(' ') + ' |', '', mdCell(n.purpose), '');
    var ins = model.edges.filter(function (e) { return e.to.node === n.id; }), outs = model.edges.filter(function (e) { return e.from.node === n.id; });
    if (ins.length) o.push('**Inbound:** ' + ins.map(function (e) { return e.id + ' ← ' + e.from.node + ' (' + e.kind + ', ' + e.label + ')'; }).join('; '), '');
    if (outs.length) o.push('**Outbound:** ' + outs.map(function (e) { return e.id + ' → ' + e.to.node + ' (' + e.kind + ', ' + e.label + ')'; }).join('; '), '');
    var b = n.spec.blueprint;
    if (b.stack || b.steps.length || b.parts.length) {
      o.push('**Blueprint · 小蓝图**', '', '| | |', '|---|---|');
      BP_HEAD.forEach(function (f) { if (b[f[0]]) o.push('| ' + f[1] + ' | ' + mdCell(b[f[0]]) + ' |'); });
      o.push('');
      if (b.parts.length) o.push('_Internal parts_', '', mdTable(BP_PART_COLS, b.parts));
      if (b.steps.length) { o.push('_Execution steps_', ''); b.steps.forEach(function (s, i) { o.push((i + 1) + '. ' + mdCell(s.text) + (s.zh ? '  \n   ' + mdCell(s.zh) : '') + (s.part ? '  \n   part: `' + s.part + '`' : '') + (s.edges.length ? ' · interfaces: ' + s.edges.join(', ') : '') + (s.fail ? '  \n   ✕ ' + mdCell(s.fail) : '')); }); o.push(''); }
    }
    SPEC_TABS.forEach(function (tb) { if (n.spec[tb.id].length) { o.push('**' + tb.label + '**', '', mdTable(tb.cols, n.spec[tb.id])); } });
    if (n.spec.skeleton) o.push('**Skeleton · 骨架代码**', '', '```python', n.spec.skeleton, '```', '');
    if (n.notes) o.push('**Notes:** ' + mdCell(n.notes), '');
    if (full) {
      var es = edgesOf(n.id);
      if (es.length) { o.push('### Interfaces of ' + n.code + ' (' + es.length + ')', ''); es.forEach(function (e) { o.push(edgeMarkdown(e)); }); }
      var links = registerRowsFor(n.code);
      if (links.length) { o.push('### Register rows bound to ' + n.code, ''); REGISTER_KEYS.forEach(function (k) { var rows = links.filter(function (l) { return l.reg === k; }).map(function (l) { return l.row; }); if (rows.length) o.push('**' + REGISTERS[k].label + '**', '', mdTable(REGISTERS[k].cols, rows)); }); }
    }
    return o.join('\n');
  }
  function edgeMarkdown(e) {
    var o = ['#### ' + e.id + ' · ' + e.from.node + ' → ' + e.to.node + ' · ' + e.kind + (e.label ? ' · ' + e.label : ''), ''];
    var rows = EDGE_FIELDS.filter(function (f) { return e.spec[f[0]]; }).map(function (f) { return { k: f[1], v: e.spec[f[0]] }; });
    if (e.steps.length) rows.unshift({ k: 'Steps', v: stepsText(e.steps) });
    o.push(rows.length ? mdTable([['k', 'Field'], ['v', 'Value']], rows) : '_spec pending_\n');
    return o.join('\n');
  }
  function workOrderMarkdown(n) {
    return ['# Work order · ' + n.code + ' · ' + n.name, '', '_' + model.meta.title + ' · ' + (model.meta.revision || '') + ' · generated ' + new Date().toISOString().slice(0, 10) + '_', '', 'This file is self-contained: identity, blueprint, every spec table, every interface this module touches (with their specs) and the rules / tests / dependencies / decisions bound to it. Hand it to an engineer or to a coding agent.', '', nodeMarkdown(n, true)].join('\n');
  }
  function specMarkdown() {
    var o = ['# ' + model.meta.title, '', '_' + (model.meta.revision || '') + ' · ' + (model.meta.date || '') + ' · ' + model.nodes.length + ' modules · ' + model.edges.length + ' interfaces_', '', '## 1. Modules', ''];
    model.tiers.forEach(function (t) {
      var ns = model.nodes.filter(function (n) { return n.tier === t.id; }); if (!ns.length) return;
      o.push('### ' + t.label + ' — ' + t.sub, '');
      ns.forEach(function (n) { o.push(nodeMarkdown(n, false)); });
    });
    o.push('## 2. Interfaces', '');
    model.edges.forEach(function (e) { o.push(edgeMarkdown(e)); });
    o.push('## 3. Registers', '');
    REGISTER_KEYS.forEach(function (k) { o.push('### ' + REGISTERS[k].label, '', mdTable(REGISTERS[k].cols, model.registers[k])); });
    return o.join('\n');
  }

  // ---------- boot ----------
  function boot() {
    model = loadModel();
    paintChips(); bindCanvas(); bindPanels(); bindToolbar();
    render(); paintRail(); paintDrawer();
    requestAnimationFrame(function () { fit(); });
    window.BP = { get model() { return model; }, select: select, render: render, showSheet: showSheet, fit: fit, workOrder: function (code) { return byId[code] ? workOrderMarkdown(byId[code]) : ''; } };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
