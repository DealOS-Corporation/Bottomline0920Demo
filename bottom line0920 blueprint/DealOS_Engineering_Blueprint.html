<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealOS × Bottomline — Engineering Blueprint</title>
<style>
:root{--rail-w:400px;--drawer-h:340px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:13px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111827;background:#f3f4f6}
#app{height:100%;display:flex;flex-direction:column}
header{background:#111827;color:#e5e7eb;flex:0 0 auto;user-select:none}
.hdr-row1{display:flex;align-items:center;gap:14px;padding:0 12px;height:46px}
.hdr-row1 .title{font-size:15px;white-space:nowrap}
.hdr-row1 .title b{color:#fff}
.hdr-row1 .title span{color:#9ca3af;margin-left:6px}
.hdr-row1 .title .rev{font-size:11px;color:#6b7280;margin-left:8px}
.sheets{display:flex;gap:2px;margin-left:12px}
.sheets button{background:#1f2937;color:#d1d5db;border:1px solid #374151;padding:5px 12px;font:inherit;cursor:pointer;border-radius:6px}
.sheets button.on{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}
.spacer{flex:1}
.actions{display:flex;gap:6px;align-items:center}
.btn{background:#374151;color:#f3f4f6;border:1px solid #4b5563;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;border-radius:5px;white-space:nowrap}
.btn:hover{background:#4b5563}
.btn.primary{background:#2563eb;border-color:#2563eb}
.btn.primary:hover{background:#1d4ed8}
.btn.danger{background:#7f1d1d;border-color:#991b1b}
.btn.on{background:#d97706;border-color:#d97706;color:#111}
.menu{position:relative}
.menu .dd{display:none;position:absolute;right:0;top:110%;background:#1f2937;border:1px solid #374151;border-radius:6px;min-width:220px;z-index:50;padding:4px}
.menu.open .dd{display:block}
.menu .dd button{display:block;width:100%;text-align:left;background:none;border:none;color:#e5e7eb;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;border-radius:4px}
.menu .dd button:hover{background:#374151}
.hdr-row2{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:5px 12px;min-height:40px;background:#1f2937;border-top:1px solid #374151}
.hdr-row2 .grp{display:flex;align-items:center;flex-wrap:wrap;gap:5px;white-space:nowrap}
.hdr-row2 .grp .lbl{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.sep{width:1px;height:22px;background:#374151;margin:0 4px;flex:0 0 auto}
.chip{border:1px solid #4b5563;background:#374151;color:#e5e7eb;border-radius:999px;padding:2px 9px;font-size:11px;cursor:pointer;white-space:nowrap}
.chip:hover{background:#4b5563}
.chip.on{background:#2563eb;border-color:#2563eb;color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#d1d5db;cursor:pointer;padding:2px 6px;border-radius:4px;border:1px solid transparent;white-space:nowrap}
.pill:hover{border-color:#4b5563}
.pill.off{opacity:.35;text-decoration:line-through}
.pill i{display:inline-block;width:16px;height:0;border-top:2px solid}
.pill i.dash{border-top-style:dashed}
.hdr-row2 select,.hdr-row2 input{background:#111827;color:#e5e7eb;border:1px solid #4b5563;border-radius:4px;padding:3px 6px;font:inherit;font-size:12px}
.hdr-row2 input{width:200px}
.zoomlbl{font-size:11px;color:#9ca3af;min-width:36px;text-align:center}

/* sheets */
.sheet-pane{display:none;flex:1;min-height:0}
#sheet-blueprint.on{display:grid;grid-template-columns:1fr 6px var(--rail-w);grid-template-rows:1fr 6px var(--drawer-h)}
#sheet-registers.on{display:flex;flex-direction:column}
#sheet-process.on{display:block}
#canvasWrap{grid-column:1;grid-row:1;overflow:auto;background:#fff;position:relative}
#canvasWrap.connect{cursor:crosshair}
#drawerResizer{grid-column:1;grid-row:2;cursor:row-resize;background:#e5e7eb}
#drawerResizer:hover,#railResizer:hover{background:#93c5fd}
#drawer{grid-column:1;grid-row:3;overflow:auto;background:#fff;border-top:1px solid #e5e7eb}
#railResizer{grid-column:2;grid-row:1/4;cursor:col-resize;background:#e5e7eb}
#rail{grid-column:3;grid-row:1/4;overflow:auto;background:#fafafa;border-left:1px solid #e5e7eb}
#processFrame{width:100%;height:100%;border:0;background:#fff}
.hint{position:absolute;left:10px;bottom:8px;background:rgba(17,24,39,.85);color:#e5e7eb;font-size:11px;padding:5px 9px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .2s}
.hint.show{opacity:1}

/* svg */
svg{display:block;font-family:inherit}
.tierlbl{font-size:12px;font-weight:700;fill:#374151;letter-spacing:.06em}
.tiersub{font-size:10px;fill:#6b7280}
.stepband{fill:none;stroke:#a7f3d0;stroke-dasharray:4 4}
.stepbandlbl{font-size:10px;fill:#047857;font-weight:600}
.node{cursor:pointer}
.node rect.box{fill:#fff;stroke-width:1.5}
.node:hover rect.box{stroke-width:2.5}
.node.sel rect.box{stroke-width:3;fill:#fffbeb}
.node.dim{opacity:.13}
.node.hit rect.box{fill:#fef9c3}
.node.status-decision rect.box{stroke-dasharray:5 3}
.node.status-external rect.box{fill:#fff7ed}
.ncode{font-size:10px;font-family:ui-monospace,Consolas,monospace;fill:#6b7280}
.nkind{font-size:9px;text-transform:uppercase;letter-spacing:.04em}
.nname{font-size:12px;font-weight:600;fill:#111827}
.nstep{font-size:9px;fill:#065f46}
.nsteprect{fill:#d1fae5}
.ngate{font-size:11px;fill:#b91c1c;font-weight:700}
.nstatus{font-size:9px;fill:#9ca3af}
.edge path.line{fill:none;stroke-width:1.7}
.edge path.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge.plumb path.line{opacity:.45;stroke-dasharray:3 4}
.edge.sel path.line{stroke-width:3.4;opacity:1;stroke-dasharray:none}
.edge.dim{opacity:.05}
.elabel{font-size:10px;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round;fill:#1f2937;pointer-events:none}
.elabel.sel{font-weight:700;fill:#111827}
.connecting rect.box{stroke:#d97706!important;stroke-width:3!important}

/* rail / drawer */
.card{padding:10px 12px}
.card h3{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .code{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#6b7280;font-weight:400}
.card .sub{color:#6b7280;font-size:11px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:5px 8px;align-items:start}
.kv label{color:#6b7280;font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding-top:5px}
.kv input,.kv select,.kv textarea{width:100%;font:inherit;font-size:12px;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;background:#fff;color:#111827}
.kv textarea{min-height:58px;resize:vertical}
.kv .chips{display:flex;flex-wrap:wrap;gap:4px;padding-top:3px}
.kv .chips .c{border:1px solid #d1d5db;border-radius:999px;padding:1px 8px;font-size:11px;cursor:pointer;background:#fff;color:#374151}
.kv .chips .c.on{background:#059669;border-color:#059669;color:#fff}
.kv .chips .c.gate.on{background:#b91c1c;border-color:#b91c1c}
.sec{margin-top:12px;border-top:1px solid #e5e7eb;padding-top:8px}
.sec h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;display:flex;justify-content:space-between}
.iflist .row{display:flex;gap:7px;align-items:center;padding:3px 5px;border-radius:4px;cursor:pointer;font-size:12px}
.iflist .row:hover{background:#eef2ff}
.iflist .row .id{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#6b7280;min-width:48px}
.iflist .row .other{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#2563eb;min-width:60px}
.iflist .row .lb{flex:1;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.linkrow{display:flex;gap:8px;padding:3px 5px;border-radius:4px;font-size:12px;cursor:pointer}
.linkrow:hover{background:#eef2ff}
.linkrow .id{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#6b7280;min-width:52px}
.badge{display:inline-block;font-size:10px;border-radius:4px;padding:1px 6px;background:#e5e7eb;color:#374151;margin-left:4px;vertical-align:middle}
.badge.proposed{background:#dbeafe;color:#1e40af}
.badge.confirmed{background:#d1fae5;color:#065f46}
.badge.decision{background:#fee2e2;color:#991b1b}
.badge.pending{background:#fef3c7;color:#92400e}
.badge.external{background:#ffedd5;color:#9a3412}
.badge.superseded{background:#e5e7eb;color:#6b7280}
.tabs{display:flex;gap:2px;border-bottom:1px solid #e5e7eb;padding:6px 8px 0;position:sticky;top:0;background:#fff;z-index:2;align-items:flex-end;overflow-x:auto;overflow-y:hidden}
.tabs button{border:1px solid transparent;border-bottom:none;background:none;padding:5px 8px;font:inherit;font-size:11.5px;cursor:pointer;border-radius:6px 6px 0 0;color:#6b7280;white-space:nowrap}
.tabs button.on{border-color:#e5e7eb;background:#fff;color:#111827;font-weight:600}
.tabs button .n{font-size:10px;color:#9ca3af;margin-left:3px}
.tabs .right{margin-left:auto;display:flex;gap:6px;padding-bottom:4px}
.sbtn{background:#fff;border:1px solid #d1d5db;border-radius:4px;padding:3px 8px;font:inherit;font-size:11px;cursor:pointer;color:#374151}
.sbtn:hover{background:#f3f4f6}
table.spec{width:100%;border-collapse:collapse;font-size:12px}
table.spec th{position:sticky;top:34px;background:#f9fafb;text-align:left;padding:5px 8px;border-bottom:1px solid #e5e7eb;font-weight:600;color:#374151;font-size:10px;text-transform:uppercase;letter-spacing:.03em;z-index:1}
table.spec td{vertical-align:top;padding:4px 8px;border-bottom:1px solid #f1f5f9;white-space:pre-wrap;word-break:break-word}
table.spec td.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px}
table.spec td[contenteditable]{outline:none;min-width:60px}
table.spec td[contenteditable]:focus{background:#fffbeb;box-shadow:inset 0 0 0 1px #f59e0b}
table.spec td.del{width:22px;color:#9ca3af;cursor:pointer;text-align:center}
table.spec td.del:hover{color:#b91c1c}
table.spec tr.clickable{cursor:pointer}
table.spec tr.clickable:hover td{background:#eef2ff}
.empty{color:#9ca3af;font-style:italic;padding:12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:10px 12px}
.formgrid .f label{display:block;color:#6b7280;font-size:10px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.formgrid .f textarea{width:100%;font:inherit;font-size:12px;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;min-height:44px;resize:vertical;font-family:ui-monospace,Consolas,monospace}
.summary{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.summary h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#6b7280}
.summary .cnt{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed #f1f5f9}
.summary .cnt b{font-variant-numeric:tabular-nums}

/* registers sheet */
#sheet-registers .regbar{display:flex;gap:2px;align-items:center;padding:8px 12px 0;background:#fff;border-bottom:1px solid #e5e7eb}
#sheet-registers .regbar button{border:1px solid transparent;border-bottom:none;background:none;padding:6px 12px;font:inherit;cursor:pointer;border-radius:6px 6px 0 0;color:#6b7280}
#sheet-registers .regbar button.on{border-color:#e5e7eb;background:#fff;color:#111827;font-weight:600}
#sheet-registers .regbar input{margin-left:auto;margin-bottom:6px;border:1px solid #d1d5db;border-radius:4px;padding:5px 8px;font:inherit;width:280px}
#regBody{flex:1;overflow:auto;background:#fff;padding:0 12px 20px}
#regBody table.spec th{top:0}
#regBody table.spec td:first-child{white-space:nowrap}
.regnote{color:#6b7280;font-size:12px;padding:8px 0}

/* 中文说明 column + node/edge zh */
table.spec th.zh,table.spec td.zh{color:#0f766e}
table.spec td.zh{min-width:200px;font-size:12px}
.kv textarea.zh,.formgrid .f textarea.zh{color:#0f766e;font-family:inherit}
.formgrid .f.wide{grid-column:1/3}
.iflist .row .lb .zh{color:#0f766e;margin-left:4px}
.card .zhline{color:#0f766e;font-size:12px;margin:2px 0 6px}

/* blueprint (小蓝图) tab */
.bpwrap{display:grid;grid-template-columns:minmax(380px,50%) 1fr;grid-template-rows:auto 1fr;height:calc(100% - 34px)}
.bphead{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 12px;padding:7px 12px;border-bottom:1px solid #e5e7eb;background:#fafafa;font-size:12px}
.bphead .k{color:#6b7280;font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding-top:2px;white-space:nowrap}
.bphead .v{color:#111827}
.bphead .v.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px}
.bpleft{border-right:1px solid #e5e7eb;padding:8px 10px;overflow:auto}
.bpright{padding:6px 12px 10px;overflow:auto}
.bpleft h5,.bpright h5{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;display:flex;justify-content:space-between}
.bpleft h5 span,.bpright h5 span{font-weight:400;text-transform:none;letter-spacing:0;color:#9ca3af}
svg.mini{display:block;width:auto;max-width:100%;height:auto}
.mini .part{cursor:default}
.mini .part rect{fill:#fff;stroke:#7c3aed;stroke-width:1.5}
.mini .part.hl rect{fill:#fef3c7;stroke-width:3}
.mini .part circle{fill:#7c3aed}
.mini .part text.pi{font-size:10px;fill:#fff;font-weight:700}
.mini .part text.pn{font-size:12px;font-weight:600;fill:#111827}
.mini .part text.pz{font-size:11px;fill:#0f766e}
.mini .part text.pf{font-size:10px;fill:#6b7280;font-family:ui-monospace,Consolas,monospace}
.mini path.flow{fill:none;stroke:#94a3b8;stroke-width:1.4}
.mini .ext{cursor:pointer}
.mini .ext rect{fill:#f8fafc;stroke:#cbd5e1;stroke-dasharray:3 3}
.mini .ext text{font-size:10px;fill:#374151;font-family:ui-monospace,Consolas,monospace}
.mini .ext:hover rect{stroke:#2563eb;stroke-dasharray:none}
.mini .ext.hl rect{fill:#fef3c7;stroke:#f59e0b;stroke-dasharray:none}
.mini text.extlbl{font-size:9px;fill:#9ca3af;text-transform:uppercase;letter-spacing:.04em}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:7px;padding:6px 6px;border-radius:6px;border-bottom:1px solid #f1f5f9}
.steps li:hover,.steps li.hl{background:#fffbeb}
.steps li.pin{box-shadow:inset 3px 0 0 #f59e0b}
.steps li .n{width:22px;height:22px;border-radius:50%;background:#111827;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps li .t{font-size:12px;color:#111827}
.steps li .z{font-size:12px;color:#0f766e;margin-top:1px}
.steps li .f{font-size:11px;color:#b91c1c;margin-top:2px}
.steps li .f::before{content:'✕ ';font-weight:700}
.steps li .refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ref{display:inline-flex;align-items:center;gap:4px;font-size:10px;border:1px solid #e5e7eb;border-radius:999px;padding:0 7px;background:#fff;color:#374151;cursor:pointer;font-family:ui-monospace,Consolas,monospace;line-height:16px}
.ref:hover{border-color:#2563eb;color:#2563eb}
.ref.part{border-style:dashed;color:#6d28d9}
.ref i{width:6px;height:6px;border-radius:50%;display:inline-block}
.bpedit{padding:8px 12px}
.bpedit h5{margin:10px 0 4px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;display:flex;justify-content:space-between;align-items:center}
.bpedit .kv{grid-template-columns:150px 1fr;max-width:1100px}

/* step highlight on the main canvas */
.edge.hl{opacity:1!important}
.edge.hl path.line{stroke-width:4.5;stroke-dasharray:none;opacity:1}
.node.hl{opacity:1!important}
.node.hl rect.box{stroke-width:3.5;fill:#fef3c7}

/* skeleton code */
.skel{display:block;width:100%;min-height:calc(100% - 34px);font:11.5px/1.45 ui-monospace,Consolas,monospace;border:0;padding:10px 14px;resize:vertical;background:#0b1220;color:#e5e7eb;white-space:pre;overflow:auto;tab-size:4}
.skel:focus{outline:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hdr-row1">
      <div class="title"><b>DealOS × Bottomline</b><span>Engineering Blueprint</span><span class="rev" id="revLabel"></span></div>
      <div class="sheets">
        <button class="on" data-sheet="blueprint">Engineering blueprint</button>
        <button data-sheet="registers">Registers</button>
        <button data-sheet="process">Business process map</button>
      </div>
      <div class="spacer"></div>
      <div class="actions">
        <button class="btn" id="btnAddNode" title="Add a module box to the selected tier">+ Module</button>
        <button class="btn" id="btnConnect" title="Click module A, then module B">+ Interface</button>
        <button class="btn danger" id="btnDelete" title="Delete selected module or interface">Delete</button>
        <span class="sep"></span>
        <div class="menu" id="menuExport"><button class="btn">Export ▾</button>
          <div class="dd">
            <button data-export="json">Blueprint model (.json)</button>
            <button data-export="md">Engineering spec (.md)</button>
            <button data-export="csv">Interfaces (.csv)</button>
            <button data-export="import">Import model (.json)…</button>
          </div>
        </div>
        <button class="btn primary" id="btnSave" title="Download this page with the current model embedded">Save as HTML</button>
      </div>
    </div>
    <div class="hdr-row2">
      <div class="grp" id="stepChips"><span class="lbl">Trace step</span></div>
      <span class="sep"></span>
      <div class="grp" id="legend"><span class="lbl">Interfaces</span></div>
      <span class="sep"></span>
      <div class="grp"><span class="lbl">Labels</span>
        <select id="labelsMode"><option value="focus">on selection</option><option value="all">all</option><option value="none">none</option></select>
      </div>
      <span class="sep"></span>
      <div class="grp"><span class="lbl">Zoom</span>
        <button class="btn" id="zoomOut">−</button><span class="zoomlbl" id="zoomLbl">100%</span><button class="btn" id="zoomIn">+</button><button class="btn" id="zoomFit">Fit</button>
      </div>
      <span class="sep"></span>
      <div class="grp"><input id="search" placeholder="Search module / interface (Enter = select)"></div>
    </div>
  </header>

  <main id="sheet-blueprint" class="sheet-pane on">
    <div id="canvasWrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><div class="hint" id="hint"></div></div>
    <div id="railResizer"></div>
    <aside id="rail"></aside>
    <div id="drawerResizer"></div>
    <section id="drawer"></section>
  </main>

  <main id="sheet-registers" class="sheet-pane">
    <div class="regbar" id="regTabs"><input id="regSearch" placeholder="Filter rows…"></div>
    <div id="regBody"></div>
  </main>

  <main id="sheet-process" class="sheet-pane">
    <iframe id="processFrame" title="Paymode business process map" srcdoc="﻿<!DOCTYPE html>
<html lang=&quot;en&quot;>
<head>
<meta charset=&quot;utf-8&quot;>
<title>Paymode Strategic Payables Analysis — End-to-End Process Map</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2c; --panel2:#1c2537; --line:#2b3549;
    --text:#e8edf6; --muted:#93a1ba; --accent:#4f8cff;
    --bank:#bd6f14; --client:#bd6f14; --analyst:#bd6f14; --engine:#7257c7; --network:#bd6f14;
    --system:#1f8f8f;
    --fail:#e0524b; --gold:#c8a24a;
    --rail-w:220px; --drawer-h:230px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:&quot;Segoe UI&quot;,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}

  #app{display:grid;grid-template-columns:1fr var(--rail-w);grid-template-rows:50px 1fr var(--drawer-h);height:100vh;transition:grid-template-rows .15s,grid-template-columns .15s}
  #app.resizing{transition:none}
  #app.no-drawer{grid-template-rows:50px 1fr 34px}
  #app.no-rail{grid-template-columns:1fr 34px}

  header{grid-column:1/3;grid-row:1;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:13.5px;margin:0;font-weight:600;white-space:nowrap}
  header .sub{font-size:11px;color:var(--muted);white-space:nowrap}
  header .spacer{flex:1}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

<script id=&quot;initial-model&quot;>window.__INITIAL_MODEL__ = null;</script>
<script>
&quot;use strict&quot;;

/* ==================== data-quality check vocabulary ====================
   A short, fixed set of well-known dimensions, plus room to add a custom one.
   Each row can carry zero or more of these; each check can carry one short note
   (e.g. on a Consistency check, which other table/field it must match). */
const CHECK_TYPES=[
  [&quot;completeness&quot;,&quot;Completeness&quot;,&quot;Is it present, not missing?&quot;],
  [&quot;accuracy&quot;,&quot;Accuracy&quot;,&quot;Is it real / correct, not implausible?&quot;],
  [&quot;consistency&quot;,&quot;Consistency&quot;,&quot;Does it agree with other tables or systems?&quot;],
  [&quot;validity&quot;,&quot;Validity&quot;,&quot;Does it match the expected format, type or business rule?&quot;],
  [&quot;uniqueness&quot;,&quot;Uniqueness&quot;,&quot;No duplicates that shouldn't exist?&quot;]
];
const CHECK_MAP=Object.fromEntries(CHECK_TYPES.map(c=>[c[0],{label:c[1],desc:c[2]}]));
const CHECK_COLORS={completeness:&quot;#2d6cdf&quot;,accuracy:&quot;#7257c7&quot;,consistency:&quot;#14866d&quot;,validity:&quot;#bd6f14&quot;,uniqueness:&quot;#b24d7a&quot;,custom:&quot;#6f7f9e&quot;};
const checkLabel=t=>CHECK_MAP[t]?CHECK_MAP[t].label:t;
const checkColor=t=>CHECK_MAP[t]?CHECK_COLORS[t]:CHECK_COLORS.custom;

/* ==================== model ==================== */
function defaultModel(){
  const PITCH=360, X0=140, NWc=280, DWc=300, NHc=140, DHc=200;
  const LANE=300, LANE2=580;
  const slotX=i=>X0+(i-1)*PITCH;

  const secDef=[
    [&quot;s1&quot;,&quot;Step 1 · Intake&quot;,&quot;Request comes in and the payment file is received&quot;,1,2],
    [&quot;s2&quot;,&quot;Step 2 · Alteryx &amp; ROC&quot;,&quot;Clean the file, prepare it, and run pricing&quot;,4,11],
    [&quot;s3&quot;,&quot;Step 3 · Campaign Classification&quot;,&quot;Review the segmentation, then approve it or refine and re-run&quot;,12,13],
    [&quot;s4&quot;,&quot;Step 4 · Internal Value Statement&quot;,&quot;Build and QA the internal value model&quot;,14,17],
    [&quot;s5&quot;,&quot;Step 5 · External ROI &amp; Deck&quot;,&quot;Build External ROI workbook, its client-facing deck, and the release package&quot;,18,23],
    [&quot;s6&quot;,&quot;Step 6 · Salesforce Sync Back&quot;,&quot;Sync back and complete downstream handoff&quot;,24,27]
  ];
  const sections=secDef.map(([id,name,subtitle,a,b])=>({
    id,name,subtitle,x:slotX(a)-22,y:100,w:(b-a)*PITCH+NWc+44,h:580
  }));

  const N=[];
  const n=(o)=>{
    const dec=o.kind===&quot;decision&quot;;
    const laneY=(o.lane===2?LANE2:LANE);
    const x=dec?slotX(o.slot)-(DWc-NWc)/2:slotX(o.slot);
    const y=laneY-(dec?DHc:NHc)/2;
    delete o.slot;delete o.lane;
    N.push(Object.assign({kind:&quot;process&quot;,actor:&quot;analyst&quot;,from:&quot;&quot;,to:&quot;&quot;,tool:&quot;&quot;,
      input:&quot;&quot;,action:&quot;&quot;,output:&quot;&quot;,source:&quot;&quot;,detail:&quot;&quot;,objective:&quot;&quot;,currentOwner:&quot;&quot;,futureOwner:&quot;&quot;,rows:[]},o,{x,y}));
  };
  /* r(item, tags, rule) — quality tags become check pills. Transformation tags
     also set a starting Action, so every output row shows both what is checked
     and what happens to the field. Actions remain freely editable in the drawer. */
  const actionForTags=tags=>{
    const t=tags||[];
    if(t.includes(&quot;judgment&quot;))return &quot;Classify&quot;;
    if(t.includes(&quot;compliance&quot;))return &quot;Flag&quot;;
    if(t.includes(&quot;normalized&quot;))return &quot;Standardize&quot;;
    if(t.includes(&quot;aggregated&quot;))return &quot;Aggregate&quot;;
    if(t.includes(&quot;matched&quot;))return &quot;Match&quot;;
    if(t.includes(&quot;key&quot;))return &quot;Keep&quot;;
    if(t.includes(&quot;derived&quot;))return &quot;Calculate&quot;;
    return &quot;&quot;;
  };
  const r=(item,tags,rule)=>({item,rule,action:actionForTags(tags),checks:(tags||[]).filter(t=>CHECK_MAP[t]).map(t=>({type:t,note:&quot;&quot;}))});

  /* ---------- Stage 1 ---------- */
  n({id:&quot;n1&quot;,section:&quot;s1&quot;,slot:1,kind:&quot;receive&quot;,actor:&quot;engine&quot;,
    title:&quot;Receive the analysis request and payment file&quot;,
    from:&quot;Bank RM&quot;,to:&quot;AI intake&quot;,tool:&quot;AI email intake&quot;,
    input:&quot;Email from the bank with the client's payment file attached&quot;,
    action:&quot;Receive the email and attachment&quot;,
    output:&quot;Client payment file&quot;,
    source:&quot;&quot;,
    detail:&quot;This is the one intake step — the bank sends the request and the payment file together (Client Name, Payment File, Payment Types, any Special Request), so nothing else needs to be received afterward. Create an early Salesforce pricing record and keep a simple status trail such as on hold / awaiting completion / in process / done / canceled.&quot;,
    objective:&quot;&quot;,
    currentOwner:&quot;Bank RM sends it; analyst receives the request and file&quot;,
    futureOwner:&quot;AI intake&quot;,
    rows:[
      r(&quot;Client name&quot;,[&quot;completeness&quot;],&quot;Who the client is&quot;),
      r(&quot;Payment file&quot;,[&quot;completeness&quot;],&quot;The email should include the client's payment file&quot;),
      r(&quot;Payment types&quot;,[&quot;completeness&quot;],&quot;If the email mentions how the client pays today, note it&quot;),
      r(&quot;Special request&quot;,[&quot;validity&quot;],&quot;If the bank asks for one version or two versions, note it&quot;),
      r(&quot;Salesforce pricing record&quot;,[&quot;completeness&quot;],&quot;Create an early pricing record and update it with simple statuses such as on hold, awaiting completion, in process, done, or canceled&quot;),
      r(&quot;Latest attachment&quot;,[&quot;consistency&quot;],&quot;If a newer file is sent later, use the latest one&quot;)]});

  n({id:&quot;n3&quot;,section:&quot;s1&quot;,slot:2,kind:&quot;decision&quot;,actor:&quot;engine&quot;,
    title:&quot;Is the file usable?&quot;,
    from:&quot;AI review&quot;,to:&quot;Bottomline Analyst&quot;,tool:&quot;AI check&quot;,
    input:&quot;Raw vendor payment file&quot;,
    action:&quot;Review the file&quot;,
    output:&quot;Ready to use / need more data&quot;,
    source:&quot;&quot;,
    detail:&quot;A quick usability check rather than a perfect-file audit. The file is usable when it has vendor or merchant name, remittance address, city/state, spend, and either a payment date or a clear 12-month assumption. Missing payment type can default to Check until clarified.&quot;,
    objective:&quot;Quick check before doing more work.&quot;,
    currentOwner:&quot;Analyst manual check&quot;,
    futureOwner:&quot;AI check&quot;,
    rows:[
      {...r(&quot;Vendor Name&quot;,[],&quot;Field exists, and the values look like vendor names rather than IDs, dates, or comments&quot;),action:&quot;Mandatory&quot;},
      {...r(&quot;Payment Date&quot;,[],&quot;Field exists, and the values behave like real dates, or there is a clear 12-month assumption if missing&quot;),action:&quot;Mandatory&quot;},
      {...r(&quot;Payment Amt&quot;,[],&quot;Field exists, and the values are numeric payment amounts&quot;),action:&quot;Mandatory&quot;},
      {...r(&quot;Address Line 1&quot;,[],&quot;Field exists, and the values look like a street or remittance line&quot;),action:&quot;Mandatory&quot;},
      {...r(&quot;City&quot;,[],&quot;Field exists, and the values look like city names&quot;),action:&quot;Mandatory&quot;},
      {...r(&quot;State&quot;,[],&quot;Field exists, and the values look like state codes or state names&quot;),action:&quot;Mandatory&quot;},
      {...r(&quot;Vendor&quot;,[],&quot;Field exists, and the values look like a client-side vendor ID or vendor code&quot;),action:&quot;Optional&quot;},
      {...r(&quot;Payment Type&quot;,[],&quot;Field exists, and the values look like real payment methods such as Check, ACH, or Wire Transfer. If the field is missing, default to Check until clarified&quot;),action:&quot;Optional&quot;},
      {...r(&quot;Bank Account&quot;,[],&quot;If this column is present, the values should look like an internal bank account field and not be mixed with other data&quot;),action:&quot;Optional&quot;},
      {...r(&quot;ZIP&quot;,[],&quot;Field exists, and the values look like postal codes&quot;),action:&quot;Optional&quot;},
      {...r(&quot;TIN#&quot;,[],&quot;If this column is present, the values should look like a tax identifier&quot;),action:&quot;Optional&quot;}]});

  n({id:&quot;n4&quot;,section:&quot;s1&quot;,slot:2,lane:2,kind:&quot;output&quot;,actor:&quot;analyst&quot;,
    title:&quot;Draft email requesting the missing data&quot;,
    from:&quot;Bottomline Analyst&quot;,to:&quot;Bank RM&quot;,tool:&quot;Email draft&quot;,
    input:&quot;The failed checks from the usability review&quot;,
    action:&quot;Ask the bank for the missing or unclear data&quot;,
    output:&quot;Request sent; wait for the corrected file&quot;,
    source:&quot;Typical issues are missing address fields, missing tax ID, unclear payment types, or totals that do not match.&quot;,
    detail:&quot;Ask the bank for a corrected file that fixes exactly what was missing or unclear — usually Vendor Name, Address, a full 12 months of Spend, or an unclear Payment Type.&quot;,
    objective:&quot;Ask for only what is needed so the client does not have to go back twice.&quot;,
    currentOwner:&quot;Analyst sends the follow-up&quot;,
    futureOwner:&quot;AI drafts it; analyst sends it&quot;,
    rows:[
      r(&quot;Vendor Name&quot;,[],&quot;Ask for a file where every row has a vendor name&quot;),
      r(&quot;Address&quot;,[],&quot;Ask for a usable address, either split out or in one full line&quot;),
      r(&quot;Spend&quot;,[],&quot;Ask for a full 12 months if only a partial period was sent&quot;),
      r(&quot;Payment Type&quot;,[&quot;validity&quot;],&quot;Ask what any unclear payment type means&quot;),
      r(&quot;Totals vs request&quot;,[&quot;consistency&quot;],&quot;If the file total does not match the request, ask which number is correct&quot;),
      r(&quot;Tax ID&quot;,[],&quot;Ask for it if possible, but do not block the case only for this&quot;),
      r(&quot;File grain&quot;,[&quot;judgment&quot;],&quot;Ask whether the file is payment-level or vendor-level if that is unclear&quot;)]});

  /* ---------- Stage 2 ---------- */
  n({id:&quot;n5&quot;,section:&quot;s2&quot;,slot:4,kind:&quot;process&quot;,actor:&quot;engine&quot;,
    title:&quot;Build the Mapping Document&quot;,
    from:&quot;AI mapping&quot;,to:&quot;Alteryx&quot;,tool:&quot;AI mapping&quot;,
    input:&quot;The client's payment file&quot;,
    action:&quot;Map the file into the standard format&quot;,
    output:&quot;Mapping file&quot;,
    source:&quot;&quot;,
    detail:&quot;Build the instruction sheet that tells Alteryx how to map the client's raw fields (Vendor ID, Payment Type, Spend, Address, Tax ID) into our standard format, and which columns like Bank Account to drop entirely.&quot;,
    objective:&quot;&quot;,
    currentOwner:&quot;Analyst builds the mapping&quot;,
    futureOwner:&quot;AI drafts the mapping; analyst reviews&quot;,
    rows:[
      r(&quot;Vendor ID&quot;,[&quot;mapped&quot;,&quot;key&quot;],&quot;Use the vendor ID if the file has one&quot;),
      r(&quot;Vendor name&quot;,[&quot;mapped&quot;],&quot;Map the vendor name&quot;),
      r(&quot;Payment type&quot;,[&quot;mapped&quot;,&quot;normalized&quot;,&quot;validity&quot;],&quot;Map payment types into one standard list&quot;),
      r(&quot;Payment date&quot;,[&quot;mapped&quot;,&quot;aggregated&quot;],&quot;Keep the latest payment date&quot;),

      {item:&quot;File 7 sheet0!A2:AJ626 → VHF!A3:AJ627&quot;,rule:&quot;Direct value copy, one row per vendor. Header-label changes are: ROC Vendor ID → Potential ROC ID; Payment Type → Payment Types; Strategic Vendor → Strategic Vendors; Discount Terms → Payment Terms; Cap Type / Max Fee → Fee Cap Type / Fee Cap.&quot;},
      {item:&quot;Reviewed input sheet0!AK2:AR626&quot;,rule:&quot;Address, City, State, Zip, and Multi Payer Vendor do not populate VHF; they are intentionally outside the Internal Value Statement calculation table.&quot;},
      {item:&quot;VHF!AK:AL&quot;,rule:&quot;Normalized Payment Type and Bank Card Program are model context fields. AI derives / validates them before formula calculation; they are not copied from File 7's address block.&quot;},
      {item:&quot;VHF!J → Segment Mapping&quot;,rule:&quot;The reviewed Segment in VHF column J is the exact lookup key used by product-segment formulas. A File 7 override therefore changes all downstream product and projection formulas.&quot;}],
    formulaRows:[
      {item:&quot;VHF!AM3:AM627 · cumulative transactions&quot;,rule:&quot;=IF(LEN(A3)=9,SUMIF($C:$C,C3,$G:$G),SUMIF($A:$A,A3,$G:$G)) — groups transactions by Vendor Name when the ROC ID is 9 digits; otherwise by ROC ID.&quot;},
      {item:&quot;VHF!AN3:AN627 · cumulative spend&quot;,rule:&quot;=IF(LEN(A3)=9,SUMIF($C:$C,C3,$H:$H),SUMIF($A:$A,A3,$H:$H)) — same grouping logic as AM, using Spend.&quot;},
      {item:&quot;VHF!AO3:AO627 · spend per transaction&quot;,rule:&quot;=AN3/AM3.&quot;},
      {item:&quot;VHF!AP3:AP627 · spend bucket&quot;,rule:&quot;=IFERROR(VLOOKUP(AN3,Spend_Bucket[[Min]:[Alternative Label]],4,TRUE),0).&quot;},
      {item:&quot;VHF!AQ3:AQ627 · network-spend tier&quot;,rule:&quot;If AG = Yes, return Strategic; otherwise look up J in SegmentMapping's Network Spend Category. For Rebate Target, use Total Network Spend (I) against Vendor_Tiers; otherwise return the mapped category.&quot;},
      {item:&quot;VHF!AR3:AR627 · payment-term override&quot;,rule:&quot;=IF(OR(AH3=\&quot;\&quot;,'Variables Internal'!$C$41=\&quot;No\&quot;),\&quot;No-Action\&quot;,IF(AND('Variables Internal'!$C$41=\&quot;Yes\&quot;,VLOOKUP(J3,'Segment Mapping'!A:T,20,FALSE)=\&quot;Yes\&quot;,VLOOKUP(AH3,'Variables Internal'!$B$43:$C$1048576,2,FALSE)=\&quot;Yes\&quot;),\&quot;Override\&quot;,\&quot;No-Action\&quot;)).&quot;},
      {item:&quot;VHF!AS3:AS627 · card data level&quot;,rule:&quot;=IF(OR(X3=\&quot;3\&quot;,X3=3,M3=\&quot;Yes\&quot;,N3=\&quot;Yes\&quot;),\&quot;Level 3\&quot;,IF(OR(X3=\&quot;2\&quot;,X3=2,L3=\&quot;Yes\&quot;),\&quot;Level 2\&quot;,IF(OR(X3=\&quot;1\&quot;,X3=1,K3=\&quot;Yes\&quot;),\&quot;Level 1\&quot;,\&quot;\&quot;))).&quot;},
      {item:&quot;VHF!AT3:AT627 · interchange category&quot;,rule:&quot;Uses AU Card Segment, AF Card Rebate Exclusions, and AS card-data level: Not Card Target / Rebate Exclusion / Alternative / STI.&quot;},
      {item:&quot;VHF!AU3:AU627 · Card Segment&quot;,rule:&quot;Nested IF plus VLOOKUP(J3, SegmentMapping, Card Segment). Uses Variables Internal C13, C25, C26, C30, C35; payment type AK; payment-term override AR; network tier AQ; Card thresholds; and Segment Mapping columns B:C, Q:R, T and W.&quot;},
      {item:&quot;VHF!AV3:AV627 · Premium Segment&quot;,rule:&quot;Nested IF plus VLOOKUP(J3, SegmentMapping, Premium Segment). Uses Variables Internal C13, C25, C30, C36; network tier AQ; cumulative spend AN; Premium thresholds; and Segment Mapping columns D:F, M and U.&quot;},
      {item:&quot;VHF!AW3:AW627 · Basic Segment&quot;,rule:&quot;Nested IF plus VLOOKUP(J3, SegmentMapping, Basic Segment). Uses Variables Internal C13, C25, C30, C37; network tier AQ; payment type AK; and Segment Mapping columns G:H and N.&quot;},
      {item:&quot;VHF!AX3:BC627 · B2C / ACH / Check / Network / International&quot;,rule:&quot;AX B2C and BC International use Variables Internal C13/C25 plus Segment Mapping; AY ACH uses C30 and Mapping K:M; AZ Check Print uses C13/C25 and payment type; BA applies C17:C20 exclusions; BB uses Mapping O/S; BD sets remain-in-house status.&quot;},
      {item:&quot;VHF!BE3:BM627 · conversion rates&quot;,rule:&quot;BE:BG Card use Conversion Rates!H5:L17 (or External Card Program!D4:T7 when C26 = Yes); BH Premium uses H21:L42; BI Basic H46:L55; BJ B2C H68:L70; BK International H74:L76; BL ACH H59:L64; BM Check Print H80:L83.&quot;},
      {item:&quot;VHF!BN3:CK627 · projections&quot;,rule:&quot;Vendor / transaction / spend projections cascade by product. Examples: BO = BF*G (Card transactions); BP = BE*H (Card spend); BR = BH*(G-BO) (Premium transactions); BS = BH*(H-BP) (Premium spend); BU = BI*(G-BR-BO) (Basic transactions); BV = BI*(H-BS-BP) (Basic spend); CK = H-CH-CE-CB-BY-BV-BS-BP (left-over spend).&quot;},
      {item:&quot;VHF!CL3:CL627 · premium rebate&quot;,rule:&quot;Uses BS Premium Spend, Lookup!C73 rebate rate, Variables Internal!C39 fee-cap flag, and AI/AJ fee-cap fields. It caps the rebate when the selected cap type requires it.&quot;},
      {item:&quot;Calculations!E5 / J5 / P5 / V5&quot;,rule:&quot;E5 = SUMIF(VHF!$AK:$AK,Calculations!E$4,VHF!$H:$H); J5 = SUM(E5:I5); P5 = SUM(K5:O5); V5 = SUM(Q5:U5). These are the model's payment-type spend, total spend, total transactions, and vendor-count controls.&quot;},
      {item:&quot;Booking Calc!G139:G149&quot;,rule:&quot;Booking output formulas feed Variables Internal: G139 = G85*H139; G140 = IF('Variables Internal'!C15=\&quot;Yes\&quot;,0,G86*H140); G142 = SUM(G143:G144); G145 = IF('Variables Internal'!C15=\&quot;Yes\&quot;,0,G91*H145); G147 = G132*H147; G148 = IF('Variables Internal'!C15=\&quot;Yes\&quot;,0,G133*H148); G149 = G134*H149.&quot;}],
    newFieldRows:[
      {item:&quot;VHF product segments&quot;,rule:&quot;Card, Premium, Basic, B2C, ACH Migration, Check Print, International, and Network Match Status are derived by formula.&quot;},
      {item:&quot;VHF value outputs&quot;,rule:&quot;Conversion rates plus vendor, transaction, spend, left-over, and premium-rebate projections are calculated for each vendor.&quot;}],
    rows:[

    source:&quot;&quot;,
    detail:&quot;Variables Internal!C13 (\&quot;Pricing Types\&quot;) is the deal-level product-list pick used to decide which workbook tabs and scenario presets are built. It is separate from vendor-level campaign assignment, which routes each vendor to Virtual Card, Premium ACH, Basic ACH, or exclusion based on industry rules. For example, the real ABG/BofA workbook has C13 = 'Card, Premium, Basic, B2C, Check Print'. Bank of America is the channel where clients most often request more than one preset from this same list: Comprehensive Payables = Card, Premium, Basic, B2C, Check Print (everything); Payment Manager Only = the same list with Card removed; Virtual Card Only = Card by itself. Other channels usually have one fixed product list per their contract, so this explicit branch matters most for BofA-style requests, where the bank will sometimes ask for two of these built side by side from the same vendor population before building the External ROI workbook.&quot;,

function anchorPt(node,i){
  const s=size(node);
  return [{x:node.x+s.w/2,y:node.y,side:&quot;top&quot;},
          {x:node.x+s.w,y:node.y+s.h/2,side:&quot;right&quot;},
          {x:node.x+s.w/2,y:node.y+s.h,side:&quot;bottom&quot;},
          {x:node.x,y:node.y+s.h/2,side:&quot;left&quot;}][i];
}
function endPoint(end){
  if(end&amp;&amp;end.node){const n=nodeById(end.node);if(n)return anchorPt(n,end.anchor);}
  return null;
}
function edgeGeom(ed){
  const a=endPoint(ed.from)||Object.assign({side:&quot;right&quot;},ed.fromPt||{x:100,y:100});
  const b=endPoint(ed.to)||Object.assign({side:&quot;left&quot;},ed.toPt||{x:300,y:200});
  return {a,b};
}
/* right angles only — never a curve */
function orthPath(a,b){
  if(a.side===&quot;left&quot;||a.side===&quot;right&quot;){
    const mx=(a.x+b.x)/2;
    return &quot;M &quot;+a.x+&quot; &quot;+a.y+&quot; L &quot;+mx+&quot; &quot;+a.y+&quot; L &quot;+mx+&quot; &quot;+b.y+&quot; L &quot;+b.x+&quot; &quot;+b.y;
  }
  const my=(a.y+b.y)/2;
  return &quot;M &quot;+a.x+&quot; &quot;+a.y+&quot; L &quot;+a.x+&quot; &quot;+my+&quot; L &quot;+b.x+&quot; &quot;+my+&quot; L &quot;+b.x+&quot; &quot;+b.y;
}
const midOf=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const clip=(t,n)=>{t=String(t||&quot;&quot;).trim()||&quot;—&quot;;return t.length>n?t.slice(0,n-1)+&quot;…&quot;:t;};
const isJudge=n=>n.kind===&quot;decision&quot;||n.kind===&quot;review&quot;;

function esc(s){return String(s==null?&quot;&quot;:s).replace(/[&amp;<>&quot;]/g,c=>({&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;<&quot;:&quot;&amp;lt;&quot;,&quot;>&quot;:&quot;&amp;gt;&quot;,'&quot;':&quot;&amp;quot;&quot;}[c]));}
function wrapText(t,per,max){
  const toks=String(t||&quot;&quot;).match(/[A-Za-z0-9@._\-\/()%$+#']+|\s+|[\s\S]/g)||[];
  const wOf=s=>/^[A-Za-z0-9@._\-\/()%$+#'\s]+$/.test(s)?s.length*0.58:s.length;
  const out=[];let cur=&quot;&quot;,cw=0;
  for(const tk of toks){
    const w=wOf(tk);
    if(/^\s+$/.test(tk)){if(cur){cur+=&quot; &quot;;cw+=0.58;}continue;}
    if(cw+w>per&amp;&amp;cur){out.push(cur.trim());cur=&quot;&quot;;cw=0;}
    cur+=tk;cw+=w;
  }
  if(cur.trim())out.push(cur.trim());
  if(out.length>max){out.length=max;out[max-1]=out[max-1].slice(0,Math.max(1,out[max-1].length-1))+&quot;…&quot;;}
  return out;
}

function edgeSVG(ed,onTop){
  const {a,b}=edgeGeom(ed);
  const d=orthPath(a,b);
  const free=(!ed.from||!ed.from.node)||(!ed.to||!ed.to.node);
  const on=sel&amp;&amp;sel.type===&quot;edge&quot;&amp;&amp;sel.id===ed.id;
  const cls=&quot;edge&quot;+(ed.kind===&quot;fail&quot;?&quot; fail&quot;:&quot;&quot;)+(free?&quot; free&quot;:&quot;&quot;)+(on?&quot; sel&quot;:&quot;&quot;);
  let s='<g data-edge=&quot;'+ed.id+'&quot;>';
  if(onTop)s+='<path class=&quot;edge-halo&quot; d=&quot;'+d+'&quot;/>';
  s+='<path class=&quot;'+cls+'&quot; d=&quot;'+d+'&quot;/><path class=&quot;edge-hit&quot; d=&quot;'+d+'&quot;/>';
  if(ed.label){
    const m=midOf(a,b),w=ed.label.length*6.4+16;
    s+='<rect class=&quot;edge-lbl-bg&quot; x=&quot;'+(m.x-w/2)+'&quot; y=&quot;'+(m.y-11)+'&quot; width=&quot;'+w+'&quot; height=&quot;20&quot; rx=&quot;5&quot;/>'+
       '<text class=&quot;edge-lbl&quot; x=&quot;'+m.x+'&quot; y=&quot;'+(m.y+3)+'&quot; text-anchor=&quot;middle&quot;>'+esc(ed.label)+'</text>';
  }
  if(on){
    s+='<circle class=&quot;handle&quot; data-hnd=&quot;from&quot; data-eid=&quot;'+ed.id+'&quot; cx=&quot;'+a.x+'&quot; cy=&quot;'+a.y+'&quot; r=&quot;7&quot;/>'+
       '<circle class=&quot;handle&quot; data-hnd=&quot;to&quot; data-eid=&quot;'+ed.id+'&quot; cx=&quot;'+b.x+'&quot; cy=&quot;'+b.y+'&quot; r=&quot;7&quot;/>';
  }
  return s+&quot;</g>&quot;;
}

      const lines=wrapText(nd.title,15,2);

      s+='<circle cx=&quot;'+(cx-52)+'&quot; cy=&quot;'+(top-24)+'&quot; r=&quot;4.5&quot; fill=&quot;'+ac.color+'&quot;/>'+
         '<text class=&quot;n-meta&quot; x=&quot;'+(cx-42)+'&quot; y=&quot;'+(top-20)+'&quot;>'+esc(KINDS[nd.kind])+' · '+esc(ac.label)+'</text>';
      lines.forEach((ln,i)=>{s+='<text class=&quot;n-title&quot; x=&quot;'+cx+'&quot; y=&quot;'+(top+i*19)+'&quot; text-anchor=&quot;middle&quot;>'+esc(ln)+'</text>';});
      const by=top+lines.length*19+4;

         '<text class=&quot;n-key&quot; x=&quot;'+cx+'&quot; y=&quot;'+(by+13)+'&quot; text-anchor=&quot;middle&quot;>TOOL · '+esc(clip(nd.tool,22)).toUpperCase()+'</text>';
      if(nd.rows.length)
        s+='<rect class=&quot;badge&quot; x=&quot;'+(cx-38)+'&quot; y=&quot;'+(by+20)+'&quot; width=&quot;76&quot; height=&quot;18&quot; rx=&quot;9&quot;/>'+
           '<text class=&quot;badge-t&quot; x=&quot;'+cx+'&quot; y=&quot;'+(by+32.5)+'&quot; text-anchor=&quot;middle&quot;>'+nd.rows.length+' checks</text>';
    }else{
      s+='<rect class=&quot;body&quot; style=&quot;stroke:'+ac.color+'&quot; x=&quot;'+nd.x+'&quot; y=&quot;'+nd.y+'&quot; width=&quot;'+sz.w+'&quot; height=&quot;'+sz.h+'&quot; rx=&quot;10&quot;/>'+
         '<circle cx=&quot;'+(nd.x+16)+'&quot; cy=&quot;'+(nd.y+18)+'&quot; r=&quot;4.5&quot; fill=&quot;'+ac.color+'&quot;/>'+
         '<text class=&quot;n-meta&quot; x=&quot;'+(nd.x+27)+'&quot; y=&quot;'+(nd.y+22)+'&quot;>'+esc(KINDS[nd.kind]||nd.kind)+' · '+esc(ac.label)+'</text>';
      wrapText(nd.title,19,2).forEach((ln,i)=>{s+='<text class=&quot;n-title&quot; x=&quot;'+(nd.x+16)+'&quot; y=&quot;'+(nd.y+46+i*19)+'&quot;>'+esc(ln)+'</text>';});
      const fy=nd.y+sz.h-48;
      s+='<line x1=&quot;'+(nd.x+16)+'&quot; y1=&quot;'+(fy-12)+'&quot; x2=&quot;'+(nd.x+sz.w-16)+'&quot; y2=&quot;'+(fy-12)+'&quot; stroke=&quot;rgba(255,255,255,.07)&quot;/>'+
         '<text class=&quot;n-key&quot; x=&quot;'+(nd.x+16)+'&quot; y=&quot;'+fy+'&quot;>FROM</text>'+
         '<text class=&quot;n-val&quot; x=&quot;'+(nd.x+52)+'&quot; y=&quot;'+fy+'&quot;>'+esc(clip(nd.from,29))+'</text>'+
         '<text class=&quot;n-key&quot; x=&quot;'+(nd.x+16)+'&quot; y=&quot;'+(fy+15)+'&quot;>TO</text>'+
         '<text class=&quot;n-val&quot; x=&quot;'+(nd.x+52)+'&quot; y=&quot;'+(fy+15)+'&quot;>'+esc(clip(nd.to,29))+'</text>'+
         '<text class=&quot;n-key&quot; x=&quot;'+(nd.x+16)+'&quot; y=&quot;'+(fy+30)+'&quot;>TOOL</text>'+
         '<text class=&quot;n-val&quot; x=&quot;'+(nd.x+52)+'&quot; y=&quot;'+(fy+30)+'&quot;>'+esc(clip(nd.tool,29))+'</text>';
      if(nd.rows.length)
        s+='<rect class=&quot;badge&quot; x=&quot;'+(nd.x+sz.w-78)+'&quot; y=&quot;'+(nd.y+8)+'&quot; width=&quot;70&quot; height=&quot;18&quot; rx=&quot;9&quot;/>'+
           '<text class=&quot;badge-t&quot; x=&quot;'+(nd.x+sz.w-43)+'&quot; y=&quot;'+(nd.y+20.5)+'&quot; text-anchor=&quot;middle&quot;>'+nd.rows.length+' '+rowWord(nd)+'</text>';
    }
    for(let i=0;i<4;i++){
      const p=anchorPt(nd,i);
      const hot=hotAnchor&amp;&amp;hotAnchor.node===nd.id&amp;&amp;hotAnchor.anchor===i;
      s+='<circle class=&quot;anchor'+(hot?&quot; hot live&quot;:&quot;&quot;)+'&quot; data-anode=&quot;'+nd.id+'&quot; data-ai=&quot;'+i+'&quot; cx=&quot;'+p.x+'&quot; cy=&quot;'+p.y+'&quot; r=&quot;'+(hot?7:5)+'&quot;/>';
    }
    s+='</g>';
  }

  if(selEdge)s+=edgeSVG(selEdge,true);   /* selected connector always on top of the boxes */

  svg.innerHTML=s;
  bind();
}

/* ==================== interaction ==================== */
function svgPt(evt){
  const r=svg.getBoundingClientRect();
  return {x:(evt.clientX-r.left)*(model.canvas.w/r.width),y:(evt.clientY-r.top)*(model.canvas.h/r.height)};
}
function nearestAnchor(p,limit){
  let best=null,bd=limit||48;
  for(const nd of model.nodes)for(let i=0;i<4;i++){
    const a=anchorPt(nd,i),d=Math.hypot(a.x-p.x,a.y-p.y);
    if(d<bd){bd=d;best={node:nd.id,anchor:i};}
  }
  return best;
}
function bind(){
  svg.querySelectorAll(&quot;[data-node]&quot;).forEach(g=>{
    g.addEventListener(&quot;mousedown&quot;,ev=>{
      if(ev.target.hasAttribute(&quot;data-anode&quot;))return;
      const id=g.getAttribute(&quot;data-node&quot;),nd=nodeById(id);
      select(&quot;node&quot;,id);
      const p=svgPt(ev);drag={id,dx:p.x-nd.x,dy:p.y-nd.y};
      ev.preventDefault();ev.stopPropagation();
    });
  });
  svg.querySelectorAll(&quot;[data-edge] .edge-hit&quot;).forEach(p=>{
    p.addEventListener(&quot;mousedown&quot;,ev=>{select(&quot;edge&quot;,p.parentNode.getAttribute(&quot;data-edge&quot;));ev.stopPropagation();});
  });
  svg.querySelectorAll(&quot;[data-hnd]&quot;).forEach(h=>{
    h.addEventListener(&quot;mousedown&quot;,ev=>{
      endDrag={eid:h.getAttribute(&quot;data-eid&quot;),end:h.getAttribute(&quot;data-hnd&quot;)};
      ev.preventDefault();ev.stopPropagation();
    });
  });
  svg.querySelectorAll(&quot;[data-anode]&quot;).forEach(a=>{
    a.addEventListener(&quot;mousedown&quot;,ev=>{
      const p=svgPt(ev);
      const ed={id:&quot;e&quot;+Date.now(),from:{node:a.getAttribute(&quot;data-anode&quot;),anchor:+a.getAttribute(&quot;data-ai&quot;)},
        to:null,fromPt:null,toPt:{x:p.x,y:p.y},label:&quot;&quot;,kind:&quot;normal&quot;,detail:&quot;&quot;};
      model.edges.push(ed);select(&quot;edge&quot;,ed.id);
      endDrag={eid:ed.id,end:&quot;to&quot;};
      ev.preventDefault();ev.stopPropagation();
    });
  });
}
svg.addEventListener(&quot;mousedown&quot;,()=>{if(!drag&amp;&amp;!endDrag)select(null);});

window.addEventListener(&quot;mousemove&quot;,ev=>{
  if(drag){
    const p=svgPt(ev),nd=nodeById(drag.id);
    nd.x=Math.round(p.x-drag.dx);nd.y=Math.round(p.y-drag.dy);
    render();return;
  }
  if(endDrag){
    const p=svgPt(ev),ed=model.edges.find(x=>x.id===endDrag.eid);
    if(!ed)return;
    hotAnchor=nearestAnchor(p);
    if(endDrag.end===&quot;from&quot;){ed.from=null;ed.fromPt={x:Math.round(p.x),y:Math.round(p.y)};}
    else{ed.to=null;ed.toPt={x:Math.round(p.x),y:Math.round(p.y)};}
    render();
  }
});
window.addEventListener(&quot;mouseup&quot;,()=>{
  if(endDrag){
    const ed=model.edges.find(x=>x.id===endDrag.eid);
    if(ed&amp;&amp;hotAnchor){
      if(endDrag.end===&quot;from&quot;){ed.from={node:hotAnchor.node,anchor:hotAnchor.anchor};ed.fromPt=null;}
      else{ed.to={node:hotAnchor.node,anchor:hotAnchor.anchor};ed.toPt=null;}
    }
    hotAnchor=null;endDrag=null;render();paint();
  }
  if(drag){drag=null;paint();}
});
function select(type,id){sel=type?{type,id}:null;render();paint();}

/* ==================== panels ==================== */
const RB=document.getElementById(&quot;railBody&quot;);
const DT=document.getElementById(&quot;drawerTitle&quot;);
const DB=document.getElementById(&quot;drawerBody&quot;);

function fld(label,key,val,opts){
  if(opts)return '<div class=&quot;fld&quot;><label>'+label+'</label><select data-k=&quot;'+key+'&quot;>'+
    opts.map(o=>'<option value=&quot;'+o[0]+'&quot;'+(o[0]===val?&quot; selected&quot;:&quot;&quot;)+'>'+o[1]+'</option>').join(&quot;&quot;)+'</select></div>';
  return '<div class=&quot;fld&quot;><label>'+label+'</label><input data-k=&quot;'+key+'&quot; value=&quot;'+esc(val)+'&quot;></div>';
}

function strip(nd){
  return '<div class=&quot;strip&quot;>'+
    fld(&quot;Input&quot;,&quot;input&quot;,nd.input)+
    fld(&quot;Action&quot;,&quot;action&quot;,nd.action)+
    fld(&quot;Output&quot;,&quot;output&quot;,nd.output)+
    fld(&quot;Current&quot;,&quot;currentOwner&quot;,nd.currentOwner||&quot;&quot;)+
    fld(&quot;Future&quot;,&quot;futureOwner&quot;,nd.futureOwner||&quot;&quot;)+
  '</div>';
}

let editCheck=null; /* {i,ci,field:'note'|'type'} — which check pill is currently being edited inline */

function checksCell(row,i){
  const list=row.checks||[];
  const pills=list.map((c,ci)=>{
    const editing=editCheck&amp;&amp;editCheck.i===i&amp;&amp;editCheck.ci===ci;
    const label=checkLabel(c.type),color=checkColor(c.type);
    if(editing&amp;&amp;editCheck.field===&quot;type&quot;){
      return '<span class=&quot;chk chk-edit&quot; style=&quot;border-color:'+color+'&quot;>'+
        '<input class=&quot;chkin&quot; data-chktypei=&quot;'+i+'&quot; data-chktypeci=&quot;'+ci+'&quot; value=&quot;'+esc(c.type)+'&quot; placeholder=&quot;Custom check name&quot;></span>';
    }
    if(editing&amp;&amp;editCheck.field===&quot;note&quot;){
      return '<span class=&quot;chk chk-edit&quot; style=&quot;border-color:'+color+'&quot;>'+esc(label)+': '+
        '<input class=&quot;chkin&quot; data-chknotei=&quot;'+i+'&quot; data-chknoteci=&quot;'+ci+'&quot; value=&quot;'+esc(c.note)+'&quot; placeholder=&quot;note&quot;></span>';
    }
    const text=c.note?label+&quot;: &quot;+clip(c.note,24):label;
    return '<span class=&quot;chk&quot; data-chki=&quot;'+i+'&quot; data-chkci=&quot;'+ci+'&quot; style=&quot;border-color:'+color+';color:'+color+'&quot; title=&quot;'+esc(c.note?label+&quot; — &quot;+c.note:label+&quot; — click to add a note&quot;)+'&quot;>'+esc(text)+
      '<b data-chkdel=&quot;'+i+'&quot; data-chkdelci=&quot;'+ci+'&quot;>✕</b></span>';
  }).join(&quot;&quot;);
  const have=list.map(c=>c.type);
  const opts=CHECK_TYPES.filter(c=>have.indexOf(c[0])<0).map(c=>'<option value=&quot;'+c[0]+'&quot;>'+c[1]+'</option>').join(&quot;&quot;);
  return '<div class=&quot;chkcell&quot;>'+pills+
    '<select class=&quot;chkadd&quot; data-chkadd=&quot;'+i+'&quot;><option value=&quot;&quot;>+ add</option>'+opts+'<option value=&quot;__custom__&quot;>+ custom…</option></select>'+
    '</div>';
}

/* extra per-node breakdown tables — same visual language as Fields &amp; rules,
   but 2 columns (item, rule) and no checks. Only shown for a node when the
   array is actually defined on it (Array.isArray(nd[key])). */
const EXTRA_SECTIONS=[
  [&quot;tabRows&quot;,&quot;Workbook tabs &amp; ranges&quot;,&quot;Tab / range&quot;,&quot;Data or purpose&quot;],
  [&quot;transformRows&quot;,&quot;Transformation types&quot;,&quot;Type&quot;,&quot;What happened&quot;],
  [&quot;formulaRows&quot;,&quot;Formula lineage&quot;,&quot;Output cell / range&quot;,&quot;Formula template and referenced inputs&quot;],
  [&quot;newFieldRows&quot;,&quot;New fields added&quot;,&quot;Field&quot;,&quot;How it's derived&quot;],
  [&quot;noteRows&quot;,&quot;Rules&quot;,&quot;Point&quot;,&quot;Detail&quot;]
];

function extraTables(nd){
  return EXTRA_SECTIONS.map(([key,label,colA,colB])=>{
    if(!Array.isArray(nd[key]))return &quot;&quot;;
    const rows=nd[key];
    let body;
    if(!rows.length){
      body='<div class=&quot;empty&quot;>No rows yet.</div>';
    }else{
      body='<div class=&quot;row-grid2&quot;><div></div><div class=&quot;col-lbl&quot;>'+colA+'</div><div class=&quot;col-lbl&quot;>'+colB+'</div><div></div></div>'+
        rows.map((row,i)=>{
          const ruleControl=key===&quot;formulaRows&quot;
            ? '<textarea data-xk=&quot;'+key+'&quot; data-xi=&quot;'+i+'&quot; data-xf=&quot;rule&quot; rows=&quot;3&quot;>'+esc(row.rule)+'</textarea>'
            : '<input data-xk=&quot;'+key+'&quot; data-xi=&quot;'+i+'&quot; data-xf=&quot;rule&quot; value=&quot;'+esc(row.rule)+'&quot;>';
          return '<div class=&quot;row-grid2 r&quot;>'+
            '<div class=&quot;num&quot;>'+(i+1)+'</div>'+
            '<div><input data-xk=&quot;'+key+'&quot; data-xi=&quot;'+i+'&quot; data-xf=&quot;item&quot; value=&quot;'+esc(row.item)+'&quot;></div>'+
            '<div>'+ruleControl+'</div>'+
            '<button class=&quot;del&quot; data-xdel=&quot;'+key+'|'+i+'&quot;>✕</button>'+

function hookExtraRows(nd){
  DB.querySelectorAll(&quot;[data-xk]&quot;).forEach(inp=>{
    inp.oninput=()=>{
      const k=inp.getAttribute(&quot;data-xk&quot;),i=+inp.getAttribute(&quot;data-xi&quot;),f=inp.getAttribute(&quot;data-xf&quot;);
      nd[k][i][f]=inp.value;
    };
  });
  DB.querySelectorAll(&quot;[data-xdel]&quot;).forEach(b=>{
    b.onclick=()=>{
      const [k,iStr]=b.getAttribute(&quot;data-xdel&quot;).split(&quot;|&quot;);
      nd[k].splice(+iStr,1);render();paint();
    };
  });
  DB.querySelectorAll(&quot;[data-xadd]&quot;).forEach(b=>{
    b.onclick=()=>{
      const k=b.getAttribute(&quot;data-xadd&quot;);
      nd[k].push({item:&quot;&quot;,rule:&quot;&quot;});render();paint();
    };
  });
}

/* Steps 4 and 5 are Excel-workbook documentation.  They deliberately use a
   fixed lineage view instead of the generic Fields / Checks / Actions editor. */
function isWorkbookStep(nd){return nd.section===&quot;s4&quot;||nd.section===&quot;s5&quot;;}
function workbookTable(nd){
  if(Array.isArray(nd.manualTabs))return manualTabTables(nd);
  if(Array.isArray(nd.manualRows)){
    const cols=[[&quot;task&quot;,&quot;What you need to do&quot;],[&quot;where&quot;,&quot;Where&quot;],[&quot;when&quot;,&quot;When&quot;],[&quot;automatic&quot;,&quot;What updates automatically&quot;]];
    return '<div class=&quot;extra-table&quot;><div class=&quot;tbl-head&quot;><h4>Deal-specific inputs</h4></div><div style=&quot;overflow:auto&quot;><div class=&quot;workbook-grid&quot;>'+
      cols.map(c=>'<div class=&quot;workbook-head&quot;>'+c[1]+'</div>').join(&quot;&quot;)+
      nd.manualRows.map(row=>'<div class=&quot;workbook-row&quot;>'+cols.map(c=>'<div class=&quot;workbook-cell '+c[0]+'&quot;>'+esc(row[c[0]]||&quot;—&quot;)+'</div>').join(&quot;&quot;)+'</div>').join(&quot;&quot;)+
      '</div></div></div>';
  }
  const rows=nd.workbookRows||[];
  const cols=[[&quot;tabRange&quot;,&quot;Tab · area&quot;],[&quot;data&quot;,&quot;What is here&quot;],[&quot;function&quot;,&quot;Formula / rule&quot;],[&quot;output&quot;,&quot;What it does&quot;]];
  if(!rows.length)return '<div class=&quot;empty&quot;>Workbook lineage for this supporting step has not been mapped yet.</div>';
  return '<div class=&quot;extra-table&quot;><div class=&quot;tbl-head&quot;><h4>Workbook tab lineage</h4></div><div style=&quot;overflow:auto&quot;><div class=&quot;workbook-grid&quot;>'+
    cols.map(c=>'<div class=&quot;workbook-head&quot;>'+c[1]+'</div>').join(&quot;&quot;)+
    rows.map(row=>{const view=Object.assign({},row,{tabRange:(row.tab||&quot;—&quot;)+&quot; · &quot;+(row.range||&quot;—&quot;)});return '<div class=&quot;workbook-row&quot;>'+cols.map(c=>'<div class=&quot;workbook-cell '+c[0]+'&quot;>'+esc(view[c[0]]||&quot;—&quot;)+'</div>').join(&quot;&quot;)+'</div>';}).join(&quot;&quot;)+
    '</div></div></div>';
}

function manualTabTables(nd){
  const header='<div class=&quot;tab-grid&quot;><div class=&quot;workbook-head&quot;>Area</div><div class=&quot;workbook-head&quot;>Manual / automatic</div><div class=&quot;workbook-head&quot;>What to do</div><div class=&quot;workbook-head&quot;>What happens</div><div></div></div>';

  const body=tabs.map((tab,ti)=>{
    const rows=(tab.rows||[]).map((row,ri)=>
      '<div class=&quot;tab-grid r&quot;>'+
        '<div><input class=&quot;tab-cell&quot; data-mtr=&quot;'+ti+'|'+ri+'|area&quot; value=&quot;'+esc(row.area||'')+'&quot;></div>'+
        '<div><select class=&quot;tab-cell&quot; data-mtr=&quot;'+ti+'|'+ri+'|mode&quot;><option value=&quot;Manual&quot;'+(row.mode===&quot;Manual&quot;?' selected':'')+'>Manual</option><option value=&quot;Automatic&quot;'+(row.mode===&quot;Automatic&quot;?' selected':'')+'>Automatic</option><option value=&quot;Check&quot;'+(row.mode===&quot;Check&quot;?' selected':'')+'>Check</option></select></div>'+
        '<div><textarea class=&quot;tab-cell&quot; data-mtr=&quot;'+ti+'|'+ri+'|action&quot; rows=&quot;2&quot;>'+esc(row.action||'')+'</textarea></div>'+

function hookManualTabs(nd){
  DB.querySelectorAll('[data-mtname]').forEach(el=>el.oninput=()=>{nd.manualTabs[+el.getAttribute('data-mtname')].name=el.value;});
  DB.querySelectorAll('[data-mtr]').forEach(el=>el.oninput=()=>{
    const [ti,ri,key]=el.getAttribute('data-mtr').split('|');nd.manualTabs[+ti].rows[+ri][key]=el.value;
  });
  DB.querySelectorAll('[data-mtadd]').forEach(b=>b.onclick=()=>{
    nd.manualTabs[+b.getAttribute('data-mtadd')].rows.push({area:'',mode:'Manual',action:'',result:''});render();paint();
  });
  DB.querySelectorAll('[data-mtdel]').forEach(b=>b.onclick=()=>{
    const [ti,ri]=b.getAttribute('data-mtdel').split('|');nd.manualTabs[+ti].rows.splice(+ri,1);render();paint();
  });
  DB.querySelectorAll('[data-mttabdel]').forEach(b=>b.onclick=()=>{
    nd.manualTabs.splice(+b.getAttribute('data-mttabdel'),1);render();paint();
  });
  const add=DB.querySelector('[data-mtaddtab]');if(add)add.onclick=()=>{
    nd.manualTabs.push({name:'New tab',rows:[{area:'',mode:'Manual',action:'',result:''}]});render();paint();
  };
}

function paint(){
  if(!sel){
    RB.innerHTML='<p class=&quot;hint&quot;>Click a box. This rail shows what the step <b>is</b> — name, stage, owner, who it comes <b>from</b>, who it goes <b>to</b>, and the <b>tool</b> that does the work. The drawer below shows Input → Action → Output on one line, then each field’s checks, transformation action, and rule.</p>';
    DT.textContent=&quot;Details&quot;;DB.innerHTML='<p class=&quot;hint&quot;>Nothing selected.</p>';return;
  }

  if(sel.type===&quot;node&quot;){
    const nd=nodeById(sel.id);if(!nd){sel=null;return paint();}
    RB.innerHTML=
      fld(&quot;Step name&quot;,&quot;title&quot;,nd.title)+
      fld(&quot;Stage&quot;,&quot;section&quot;,nd.section,model.sections.map(s=>[s.id,s.name]))+
      fld(&quot;Action type&quot;,&quot;kind&quot;,nd.kind,Object.entries(KINDS))+
      fld(&quot;Owner&quot;,&quot;actor&quot;,nd.actor,Object.entries(ACTORS).map(([k,v])=>[k,v.label]))+
      fld(&quot;From — who hands it over&quot;,&quot;from&quot;,nd.from)+
      fld(&quot;To — who receives it&quot;,&quot;to&quot;,nd.to)+
      fld(&quot;Tool — what does the work&quot;,&quot;tool&quot;,nd.tool)+
      '<div class=&quot;kv&quot;>ID '+nd.id+' · '+nd.rows.length+' '+rowWord(nd)+' · position '+nd.x+', '+nd.y+'</div>';

    DT.textContent=&quot;Details — &quot;+nd.title;
    if(isWorkbookStep(nd)){
      DB.innerHTML='<div class=&quot;workbook-intro&quot;>'+esc(nd.detail||&quot;This workbook step is documented tab by tab below.&quot;)+'</div>'+workbookTable(nd);
      hookManualTabs(nd);
      return;
    }
    DB.innerHTML=strip(nd)+
      (nd.detail?'<div class=&quot;fld detail-fld&quot;><label>Detail — one plain sentence: what does this step do</label>'+
        '<textarea data-k=&quot;detail&quot; rows=&quot;2&quot; placeholder=&quot;Explain what happens in this step…&quot;>'+esc(nd.detail||&quot;&quot;)+'</textarea></div>':&quot;&quot;)+
      extraTables(nd)+
      '<div class=&quot;tbl-head&quot;><h4>'+(isJudge(nd)?&quot;Checklist&quot;:&quot;Fields &amp;amp; actions&quot;)+'</h4>'+
        '<div class=&quot;obj&quot;><input data-k=&quot;objective&quot; placeholder=&quot;Objective — what this table is trying to prove&quot; value=&quot;'+esc(nd.objective)+'&quot;></div>'+

      '<div id=&quot;rowList&quot;></div>';

    hookExtraRows(nd);
    hookInputs(nd);
    return;
  }

  const ed=model.edges.find(x=>x.id===sel.id);
  if(!ed){sel=null;return paint();}
  const nn=id=>{const n=nodeById(id);return n?n.title:&quot;(not connected)&quot;;};
  RB.innerHTML=
    fld(&quot;Connector label&quot;,&quot;label&quot;,ed.label)+
    fld(&quot;Type&quot;,&quot;kind&quot;,ed.kind,[[&quot;normal&quot;,&quot;Normal path&quot;],[&quot;fail&quot;,&quot;Failure / rework (red dashed)&quot;]])+
    '<div class=&quot;fld&quot;><label>From</label><input value=&quot;'+esc(ed.from?nn(ed.from.node):&quot;Free endpoint&quot;)+'&quot; disabled></div>'+

function paintRows(nd){
  const box=document.getElementById(&quot;rowList&quot;);if(!box)return;
  if(!nd.rows.length){
    box.innerHTML='<div class=&quot;empty&quot;>No rows on this step — nothing is judged and no field changes here, it simply passes through. Add a row only where a field is created, dropped, or has to be checked.</div>';
  }else{
    box.innerHTML='<div class=&quot;row-grid&quot;><div></div><div class=&quot;col-lbl&quot;>Field / item</div><div class=&quot;col-lbl&quot;>Action</div><div class=&quot;col-lbl&quot;>Rule — what must be true</div><div></div></div>'+
      nd.rows.map((row,i)=>
        '<div class=&quot;row-grid r&quot;>'+
          '<div class=&quot;num&quot;>'+(i+1)+'</div>'+
          '<div><input data-ri=&quot;'+i+'&quot; data-rk=&quot;item&quot; value=&quot;'+esc(row.item)+'&quot;></div>'+
          '<div><input data-ri=&quot;'+i+'&quot; data-rk=&quot;action&quot; value=&quot;'+esc(row.action||&quot;&quot;)+'&quot; placeholder=&quot;e.g. Keep&quot;></div>'+
          '<div><input data-ri=&quot;'+i+'&quot; data-rk=&quot;rule&quot; value=&quot;'+esc(row.rule)+'&quot;></div>'+
          '<button class=&quot;del&quot; data-rdel=&quot;'+i+'&quot;>✕</button>'+
        '</div>').join(&quot;&quot;);
  }
  hookRows(nd);
  const add=document.getElementById(&quot;rowAdd&quot;);
  if(add)add.onclick=()=>{nd.rows.push({item:&quot;&quot;,rule:&quot;&quot;,action:&quot;&quot;,checks:[]});render();paint();};
}

function hookRows(nd){
  const box=document.getElementById(&quot;rowList&quot;);if(!box)return;
  box.querySelectorAll(&quot;[data-ri]&quot;).forEach(inp=>{
    inp.oninput=()=>{nd.rows[+inp.getAttribute(&quot;data-ri&quot;)][inp.getAttribute(&quot;data-rk&quot;)]=inp.value;};
  });
  box.querySelectorAll(&quot;[data-rdel]&quot;).forEach(b=>{
    b.onclick=()=>{nd.rows.splice(+b.getAttribute(&quot;data-rdel&quot;),1);render();paint();};
  });
  box.querySelectorAll(&quot;[data-chkdel]&quot;).forEach(b=>{
    b.onclick=(ev)=>{
      ev.stopPropagation();
      const i=+b.getAttribute(&quot;data-chkdel&quot;),ci=+b.getAttribute(&quot;data-chkdelci&quot;);
      nd.rows[i].checks.splice(ci,1);
      editCheck=null;paintRows(nd);
    };
  });
  box.querySelectorAll(&quot;[data-chki]&quot;).forEach(el=>{
    el.onclick=()=>{
      editCheck={i:+el.getAttribute(&quot;data-chki&quot;),ci:+el.getAttribute(&quot;data-chkci&quot;),field:&quot;note&quot;};
      paintRows(nd);
    };
  });
  box.querySelectorAll(&quot;[data-chknotei]&quot;).forEach(inp=>{
    inp.focus();inp.select();
    const commit=()=>{
      const i=+inp.getAttribute(&quot;data-chknotei&quot;),ci=+inp.getAttribute(&quot;data-chknoteci&quot;);
      if(nd.rows[i]&amp;&amp;nd.rows[i].checks[ci])nd.rows[i].checks[ci].note=inp.value.trim();
      editCheck=null;paintRows(nd);
    };
    inp.onblur=commit;
    inp.onkeydown=ev=>{if(ev.key===&quot;Enter&quot;)commit();if(ev.key===&quot;Escape&quot;){editCheck=null;paintRows(nd);}};
  });
  box.querySelectorAll(&quot;[data-chktypei]&quot;).forEach(inp=>{
    inp.focus();inp.select();
    const commit=()=>{
      const i=+inp.getAttribute(&quot;data-chktypei&quot;),ci=+inp.getAttribute(&quot;data-chktypeci&quot;),v=inp.value.trim();
      if(!v)nd.rows[i].checks.splice(ci,1);else nd.rows[i].checks[ci].type=v;
      editCheck=null;paintRows(nd);
    };
    inp.onblur=commit;
    inp.onkeydown=ev=>{
      if(ev.key===&quot;Enter&quot;)commit();
      if(ev.key===&quot;Escape&quot;){
        const i=+inp.getAttribute(&quot;data-chktypei&quot;),ci=+inp.getAttribute(&quot;data-chktypeci&quot;);
        nd.rows[i].checks.splice(ci,1);editCheck=null;paintRows(nd);
      }
    };
  });
  box.querySelectorAll(&quot;[data-chkadd]&quot;).forEach(sl=>{
    sl.onchange=()=>{
      const i=+sl.getAttribute(&quot;data-chkadd&quot;),val=sl.value;
      if(!val)return;
      if(val===&quot;__custom__&quot;){
        nd.rows[i].checks.push({type:&quot;&quot;,note:&quot;&quot;});
        editCheck={i,ci:nd.rows[i].checks.length-1,field:&quot;type&quot;};
      }else{
        nd.rows[i].checks.push({type:val,note:&quot;&quot;});
      }
      paintRows(nd);
    };
  });
}

function hookInputs(obj){
  document.querySelectorAll(&quot;#railBody [data-k],#drawerBody [data-k]&quot;).forEach(el=>{
    el.oninput=()=>{
      const k=el.getAttribute(&quot;data-k&quot;);obj[k]=el.value;render();
      if(k===&quot;section&quot;||k===&quot;kind&quot;||k===&quot;actor&quot;||k===&quot;title&quot;||k===&quot;label&quot;)paint();
    };
  });
}

/* ==================== toolbar ==================== */
document.getElementById(&quot;btnNode&quot;).onclick=()=>{
  const nd={id:&quot;n&quot;+Date.now(),section:model.sections[0].id,kind:&quot;process&quot;,actor:&quot;analyst&quot;,
    title:&quot;New step&quot;,from:&quot;&quot;,to:&quot;&quot;,tool:&quot;&quot;,input:&quot;&quot;,action:&quot;&quot;,output:&quot;&quot;,source:&quot;&quot;,detail:&quot;&quot;,objective:&quot;&quot;,rows:[],
    x:Math.round(wrap.scrollLeft+200),y:Math.round(wrap.scrollTop+180)};
  model.nodes.push(nd);select(&quot;node&quot;,nd.id);
};
document.getElementById(&quot;btnEdge&quot;).onclick=()=>{
  const x=Math.round(wrap.scrollLeft+240),y=Math.round(wrap.scrollTop+140);
  const ed={id:&quot;e&quot;+Date.now(),from:null,to:null,fromPt:{x,y},toPt:{x:x+240,y:y+140},label:&quot;&quot;,kind:&quot;normal&quot;,detail:&quot;&quot;};
  model.edges.push(ed);select(&quot;edge&quot;,ed.id);
};
document.getElementById(&quot;btnDel&quot;).onclick=()=>{
  if(!sel)return;
  if(sel.type===&quot;node&quot;){
    model.nodes=model.nodes.filter(n=>n.id!==sel.id);
    model.edges=model.edges.filter(e=>!(e.from&amp;&amp;e.from.node===sel.id)&amp;&amp;!(e.to&amp;&amp;e.to.node===sel.id));
  }else model.edges=model.edges.filter(e=>e.id!==sel.id);
  select(null);
};
document.getElementById(&quot;btnSave&quot;).onclick=()=>{
  document.getElementById(&quot;initial-model&quot;).textContent=&quot;window.__INITIAL_MODEL__ = &quot;+JSON.stringify(model)+&quot;;&quot;;
  const html=&quot;<!DOCTYPE html>\n&quot;+document.documentElement.outerHTML;
  const a=document.createElement(&quot;a&quot;);
  a.href=URL.createObjectURL(new Blob([html],{type:&quot;text/html;charset=utf-8&quot;}));
  a.download=&quot;Paymode_Process_Map_&quot;+new Date().toISOString().slice(0,10)+&quot;.html&quot;;
  a.click();URL.revokeObjectURL(a.href);
};

const app=document.getElementById(&quot;app&quot;);
document.getElementById(&quot;tDrawer&quot;).onclick=e=>{
  app.classList.toggle(&quot;no-drawer&quot;);
  e.target.textContent=app.classList.contains(&quot;no-drawer&quot;)?&quot;▴&quot;:&quot;▾&quot;;
};
document.getElementById(&quot;tRail&quot;).onclick=e=>{
  app.classList.toggle(&quot;no-rail&quot;);
  e.target.textContent=app.classList.contains(&quot;no-rail&quot;)?&quot;◂&quot;:&quot;▸&quot;;
};

/* ---- drag to resize the drawer height / rail width ---- */
function makeResizable(handle,varName,axis,min,max){
  let dragging=false,startPos=0,startSize=0;
  handle.addEventListener(&quot;mousedown&quot;,ev=>{
    dragging=true;
    startPos=axis===&quot;x&quot;?ev.clientX:ev.clientY;
    startSize=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(varName))||min;
    app.classList.add(&quot;resizing&quot;);
    handle.classList.add(&quot;active&quot;);
    document.body.style.cursor=axis===&quot;x&quot;?&quot;col-resize&quot;:&quot;row-resize&quot;;
    document.body.style.userSelect=&quot;none&quot;;
    ev.preventDefault();
  });
  window.addEventListener(&quot;mousemove&quot;,ev=>{
    if(!dragging)return;
    const cur=axis===&quot;x&quot;?ev.clientX:ev.clientY;
    const size=Math.max(min,Math.min(max,startSize+(startPos-cur)));
    document.documentElement.style.setProperty(varName,size+&quot;px&quot;);
  });
  window.addEventListener(&quot;mouseup&quot;,()=>{
    if(!dragging)return;
    dragging=false;
    app.classList.remove(&quot;resizing&quot;);
    handle.classList.remove(&quot;active&quot;);
    document.body.style.cursor=&quot;&quot;;
    document.body.style.userSelect=&quot;&quot;;
  });
}
makeResizable(document.getElementById(&quot;railResize&quot;),&quot;--rail-w&quot;,&quot;x&quot;,160,640);
makeResizable(document.getElementById(&quot;drawerResize&quot;),&quot;--drawer-h&quot;,&quot;y&quot;,120,700);

document.getElementById(&quot;hTitle&quot;).textContent=model.meta.title;
document.getElementById(&quot;hSub&quot;).textContent=model.meta.subtitle;
render();paint();
</script>
